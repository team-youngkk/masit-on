      .section{font-size:21px;font-weight:800}.sectionSub{font-size:13px;fill:#667770}
      .screenTitle{font-size:15px;font-weight:800}.route{font:11px 'Cascadia Code',Consolas,monospace;fill:#528271}
      .label{font-size:11px;fill:#667770}.tiny{font-size:10px;fill:#7b8984}.bold{font-size:12px;font-weight:700}
      .outer{fill:#fff;stroke:#b8cfc4;stroke-width:1.5}.chrome{fill:#edf4ef}.line{stroke:#cadbd2;stroke-width:1.3}
      .fill{fill:#dce9e2}.fillDark{fill:#94b7a7}.fillWarm{fill:#f2e9d6}.fillGreen{fill:#d5e8dc}
      .button{fill:#e4f0e8;stroke:#9dbdac;stroke-width:1}.buttonText{font-size:10px;font-weight:700;fill:#356451}
      .arrow{stroke:#477b68;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#8eafa0;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
      .dot{fill:#3a725d}.muted{fill:#f4f6f2;stroke:#d6e0da;stroke-width:1}
    </style>
  </defs>

