# masiton.click 리버스 프록시 — M2-08.
# 경로 소유권은 ADR-WEB-003 6.1절을 그대로 따른다.
#   /api/**      -> Spring Boot (127.0.0.1:8080)
#   /internal/** -> 인터넷 진입점에서 차단. 전달하지 않는다
#   그 외        -> Next.js (127.0.0.1:3000)
#
# 목적지는 경로 접두사만으로 정한다. 요청 헤더·User-Agent·응답 형식으로
# 프론트엔드와 백엔드를 구분하지 않는다(ADR-WEB-003 11절).

upstream masiton_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream masiton_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

# 알려지지 않은 Host와 Elastic IP 직접 접근을 끊는다. SNI·Host가 masiton.click이
# 아닌 요청에 응답하면 도메인 밖 경로로 서비스가 노출된다.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name masiton.click;

    # 인증서 검증은 DNS 방식이라 HTTP-01 챌린지 경로가 필요 없다.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/tls/masiton.click.fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/masiton.click.key;

    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name masiton.click;

    ssl_certificate /etc/nginx/tls/masiton.click.fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/masiton.click.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:masiton_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 오류 응답에 서버 버전을 싣지 않는다.
    server_tokens off;

    client_max_body_size 2m;

    # M2-11 검증 참여자 제한 공개. HTTPS 뒤에서만 쓴다(80은 위 server 블록이
    # 인증 확인 전에 리다이렉트한다). htpasswd는 tmpfs에 기동 시점마다 렌더링한다
    # (deploy/scripts/basic-auth-render.sh).
    #
    # 이것은 제한 공개 수단이며 관리자 인증을 대체하지 않는다. /api/admin/**의
    # JWT·ADMIN 검증은 그대로다(NFR-SECURITY-001). Bearer JWT를 실은 요청은 Basic
    # 자격 증명을 담을 수 없어 location /api/ 가 이 값을 변수로 덮는다.
    auth_basic "masiton verification";
    auth_basic_user_file /run/masiton/htpasswd;

    # ADR-WEB-003 11절: /internal/**은 인터넷 Nginx 경로로 전달하지 않는다.
    # 404로 응답해 경로의 존재 여부도 드러내지 않는다. `^~`로 정규식 location보다
    # 먼저 확정시켜 뒤에 어떤 규칙이 추가되어도 이 차단이 우회되지 않게 한다.
    # Basic Auth보다 앞서 차단한다. auth_basic을 상속하면 자격 증명이 없을 때
    # 401이 되어 "인증만 통과하면 열리는 경로"로 보이고, M2-08에서 검증한 404와도
    # 달라진다. 이 경로는 자격 증명과 무관하게 없는 것으로 응답해야 한다.
    location ^~ /internal/ {
        auth_basic off;
        access_log off;
        return 404;
    }

    location = /internal {
        auth_basic off;
        return 404;
    }

    location /api/ {
        # 관리자 JWT를 실은 요청은 Basic 자격 증명을 같은 헤더에 담을 수 없다.
        # 판정과 근거는 01-masiton-api-auth-map.conf에 있다.
        auth_basic $masiton_api_realm;

        proxy_pass http://masiton_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://masiton_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
