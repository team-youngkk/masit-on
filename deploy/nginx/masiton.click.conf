# masiton.click reverse proxy.
# Authentication and authorization are application responsibilities.

upstream masiton_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream masiton_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /_masiton/alb-health {
        access_log off;
        proxy_pass http://masiton_backend/internal/health/ready;
        proxy_set_header Host $host;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
        proxy_intercept_errors off;
    }

    location / { return 444; }
}

server {
    listen 80;
    listen [::]:80;
    server_name masiton.click;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/tls/masiton.click.fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/masiton.click.key;

    location = /_masiton/alb-health {
        access_log off;
        proxy_pass http://masiton_backend/internal/health/ready;
        proxy_set_header Host $host;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
        proxy_intercept_errors off;
    }

    location / { return 444; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name masiton.click;

    ssl_certificate /etc/nginx/tls/masiton.click.fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/masiton.click.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:masiton_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;
    client_max_body_size 2m;

    location ^~ /internal/ { access_log off; return 404; }
    location = /internal { access_log off; return 404; }

    # Webhook authentication remains in the application; this location only limits abuse.
    location = /api/webhooks/youtube/channel-updates {
        limit_req zone=masiton_ungated burst=20 nodelay;
        limit_req_status 429;
        if ($request_method !~ ^(GET|POST)$) { return 405; }
        client_max_body_size 128k;
        proxy_pass http://masiton_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Keep every API route on Spring Security. Undefined API routes must not fall
    # through to the frontend.
    location = /api {
        proxy_pass http://masiton_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location ^~ /api/ {
        proxy_pass http://masiton_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://masiton_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
