# masiton.click 리버스 프록시 — M2-08.
# 경로 소유권은 ADR-WEB-003 6.1절을 그대로 따른다.
#   /api/**      -> Spring Boot (127.0.0.1:8080)
#   /internal/** -> 인터넷 진입점에서 차단. 전달하지 않는다
#   그 외        -> Next.js (127.0.0.1:3000)
#
# 목적지는 경로 접두사만으로 정한다. 요청 헤더·User-Agent·응답 형식으로
# 프론트엔드와 백엔드를 구분하지 않는다(ADR-WEB-003 11절).

upstream masiton_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream masiton_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

# 알려지지 않은 Host와 Elastic IP 직접 접근을 끊는다. SNI·Host가 masiton.click이
# 아닌 요청에 응답하면 도메인 밖 경로로 서비스가 노출된다.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ALB health check용 비민감 응답. 기본 server에서만 제공하며 애플리케이션의
    # `/internal/**` 경계를 외부에 열지 않는다. backend readiness 상태만 status로
    # 반영하고 본문은 노출하지 않는다.
    location = /_masiton/alb-health {
        access_log off;
        proxy_pass http://masiton_backend/internal/health/ready;
        proxy_set_header Host $host;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
        proxy_intercept_errors off;
    }

    # server 컨텍스트의 return은 rewrite 단계에서 location 선택보다 먼저 실행되어
    # 요청을 종료시킨다. 위 alb-health location을 살리려면 이 차단을 location으로
    # 내려야 한다. `= /_masiton/alb-health`가 `/`보다 우선하므로 health 경로만
    # 통과하고 그 밖의 알 수 없는 Host·직접 IP 접근은 그대로 끊긴다.
    location / {
        return 444;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name masiton.click;

    # 인증서 검증은 DNS 방식이라 HTTP-01 챌린지 경로가 필요 없다.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/tls/masiton.click.fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/masiton.click.key;

    # ALB health check용 비민감 응답. ALB는 Nginx까지 HTTPS로 재암호화한다.
    location = /_masiton/alb-health {
        access_log off;
        proxy_pass http://masiton_backend/internal/health/ready;
        proxy_set_header Host $host;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
        proxy_intercept_errors off;
    }

    # server 컨텍스트의 return은 rewrite 단계에서 location 선택보다 먼저 실행되어
    # 요청을 종료시킨다. 위 alb-health location을 살리려면 이 차단을 location으로
    # 내려야 한다. `= /_masiton/alb-health`가 `/`보다 우선하므로 health 경로만
    # 통과하고 그 밖의 알 수 없는 Host·직접 IP 접근은 그대로 끊긴다.
    location / {
        return 444;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name masiton.click;

    ssl_certificate /etc/nginx/tls/masiton.click.fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/masiton.click.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:masiton_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 오류 응답에 서버 버전을 싣지 않는다.
    server_tokens off;

    # 공개 경로의 비허용 메서드는 error_page로 @verification_api에 들어간 뒤,
    # auth_request의 401/503을 계약 JSON Adapter로 한 번 더 전환해야 한다. 첫 전환
    # 전에 적용돼야 하므로 이 HTTPS virtual server 범위에서 재귀 처리를 허용한다.
    # 각 종착 Adapter location에는 error_page가 없어 다시 진입하는 순환은 없다.
    recursive_error_pages on;

    client_max_body_size 2m;

    # ADR-WEB-003 11절: /internal/**은 인터넷 Nginx 경로로 전달하지 않는다.
    # 404로 응답해 경로의 존재 여부도 드러내지 않는다. `^~`로 정규식 location보다
    # 먼저 확정시켜 뒤에 어떤 규칙이 추가되어도 이 차단이 우회되지 않게 한다.
    # 이 경로는 자격 증명과 무관하게 없는 것으로 응답해야 한다.
    location ^~ /internal/ {
        access_log off;
        return 404;
    }

    location = /internal {
        return 404;
    }

    # auth_request 전용 위치는 외부에서 직접 호출할 수 없다. Cookie만 전달하며
    # Authorization 헤더는 전달하지 않아 회원·관리자 Bearer 경계와 분리한다.
    location = /_verification/session {
        internal;
        proxy_pass http://masiton_backend/internal/verification/session;
        proxy_set_header Host $host;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /_verification/access-required {
        internal;
        proxy_pass http://masiton_backend/internal/verification/access-required;
        proxy_set_header Host $host;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /_verification/unavailable {
        internal;
        proxy_pass http://masiton_backend/internal/verification/unavailable;
        proxy_set_header Host $host;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 로그인 화면과 세션 API는 검증 세션을 만들고 지우는 경로이므로 gate보다 앞선다.
    location = /verification/login {
        limit_except GET {
            deny all;
        }

        proxy_pass http://masiton_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # 검증 로그인 화면에서도 헤더·푸터 브랜드 마크를 표시할 수 있어야 한다.
    # 이 파일은 Next metadata route(`/icon.png`)에서 제공되지만 검증 세션 없이도
    # 로드되어야 하므로 일반 페이지의 auth_request보다 앞에서 정적 GET만 허용한다.
    location = /icon.png {
        limit_except GET {
            deny all;
        }

        proxy_pass http://masiton_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
    }

    location ^~ /_next/static/ {
        limit_except GET {
            deny all;
        }

        proxy_pass http://masiton_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location = /api/verification/sessions {
        # 이 exact 경로의 다른 메서드까지 gate를 우회하지 않게 한다. return만 쓰는
        # rewrite 조건은 안전하며, named location은 원래 URI와 메서드를 보존한다.
        error_page 419 = @verification_api;
        if ($request_method !~ ^(POST|DELETE)$) {
            return 419;
        }

        proxy_pass http://masiton_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # 회원·관리자 Bearer 경계와 분리한다는 계약을 이 위치에도 일관되게 적용한다.
        proxy_set_header Authorization "";
    }

    # PubSubHubbub 허브는 브라우저가 아니므로 검증 세션 쿠키를 보낼 수 없다. prefix
    # `location /api/`의 세션 gate에 걸리면 구독 확인 GET이 hub.challenge를 되돌려주지
    # 못해 구독 자체가 성립하지 않는다. exact-match로 분리해 gate에서 제외한다.
    # 인증은 GET은 hub.verify_token, POST는 X-Hub-Signature-256 HMAC이 담당한다.
    # 제외를 허용하는 조건은 ADR-DEPLOY-004 6.2절이 정한다.
    location = /api/webhooks/youtube/channel-updates {
        # gate 안의 경로와 달리 무인증 요청이 백엔드 트랜잭션까지 도달하므로 유량을
        # 제한한다. 허브는 이 한도를 넘길 만큼 자주 호출하지 않는다. 429는 허브의
        # 재시도 대상이며, gate의 401과 달리 계약 JSON을 돌려줄 상대가 없다.
        limit_req zone=masiton_ungated burst=20 nodelay;
        limit_req_status 429;

        # 계약이 허용한 두 메서드만 Nginx에서 통과시킨다. 나머지는 Spring Security의
        # `/api/**` 경계와 마찬가지로 검증 세션 gate를 거치게 한다. limit_except의
        # GET은 HEAD도 함께 허용하므로 정확한 메서드 비교를 사용한다.
        error_page 419 = @verification_webhook;
        if ($request_method !~ ^(GET|POST)$) {
            return 419;
        }

        # 애플리케이션 한도는 64KB다. server 전역 2m를 그대로 두면 어차피 거부할 본문을
        # Nginx가 전량 버퍼링해 임시 파일로 쓴다.
        client_max_body_size 128k;

        proxy_pass http://masiton_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # 외부 허브가 보낸 자격 증명 헤더를 그대로 흘려보내지 않는다. 회원·관리자 Bearer
        # 경계와 검증 세션 어느 쪽도 이 경로로 넘어오지 못하게 비운다.
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        # `location /api/`와 같은 값으로 고정한다. 생략하면 Nginx 기본 60s가 적용돼
        # 백엔드가 느려질 때 worker 커넥션을 두 배 오래 점유한다.
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Webhook의 비허용 메서드도 검증 세션 gate는 통과해야 하지만, 검증에 성공한 뒤
    # 실제 webhook 요청으로 외부 자격 증명을 전달해서는 안 된다. auth_request에는
    # 검증 쿠키를 사용하고 최종 backend proxy에서는 Authorization과 Cookie를 비운다.
    location @verification_webhook {
        auth_request /_verification/session;
        error_page 401 = /_verification/access-required;
        error_page 500 503 = /_verification/unavailable;

        proxy_pass http://masiton_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Spring Security가 permitAll로 소유하는 공개 API는 검증 참여자 세션 gate와
    # 분리한다. 경로뿐 아니라 메서드도 일치할 때만 @public_api로 보내며, 같은 경로의
    # 다른 메서드는 @verification_api에서 기존 gate를 그대로 거친다.
    location = /api/restaurants {
        error_page 418 = @public_api;
        error_page 419 = @verification_api;
        if ($request_method = GET) { return 418; }
        return 419;
    }

    location = /api/curations {
        error_page 418 = @public_api;
        error_page 419 = @verification_api;
        if ($request_method = GET) { return 418; }
        return 419;
    }

    location = /api/creators {
        error_page 418 = @public_api;
        error_page 419 = @verification_api;
        if ($request_method = GET) { return 418; }
        return 419;
    }

    # 외부 식별자는 UUID로 가정하지 않는다. 슬래시가 아닌 불투명 단일 segment만
    # 허용하고 끝을 anchor해 하위 경로가 상세 조회 규칙을 재사용하지 못하게 한다.
    location ~ ^/api/restaurants/[^/]+$ {
        error_page 418 = @public_api;
        error_page 419 = @verification_api;
        if ($request_method = GET) { return 418; }
        return 419;
    }

    location ~ ^/api/curations/[^/]+$ {
        error_page 418 = @public_api;
        error_page 419 = @verification_api;
        if ($request_method = GET) { return 418; }
        return 419;
    }

    location ~ ^/api/creators/[^/]+$ {
        error_page 418 = @public_api;
        error_page 419 = @verification_api;
        if ($request_method = GET) { return 418; }
        return 419;
    }

    location ~ ^/api/creators/[^/]+/(restaurants|videos)$ {
        error_page 418 = @public_api;
        error_page 419 = @verification_api;
        if ($request_method = GET) { return 418; }
        return 419;
    }

    location = /api/auth/registrations {
        error_page 418 = @public_api;
        error_page 419 = @verification_api;
        if ($request_method = POST) { return 418; }
        return 419;
    }

    location = /api/auth/email-verifications {
        error_page 418 = @public_api;
        error_page 419 = @verification_api;
        if ($request_method = POST) { return 418; }
        return 419;
    }

    location = /api/auth/email-verifications/resend {
        error_page 418 = @public_api;
        error_page 419 = @verification_api;
        if ($request_method = POST) { return 418; }
        return 419;
    }

    location = /api/auth/password-resets/requests {
        error_page 418 = @public_api;
        error_page 419 = @verification_api;
        if ($request_method = POST) { return 418; }
        return 419;
    }

    location = /api/auth/password-resets/confirmations {
        error_page 418 = @public_api;
        error_page 419 = @verification_api;
        if ($request_method = POST) { return 418; }
        return 419;
    }

    location = /api/auth/tokens {
        error_page 418 = @public_api;
        error_page 419 = @verification_api;
        if ($request_method = POST) { return 418; }
        return 419;
    }

    location = /api/auth/tokens/refresh {
        error_page 418 = @public_api;
        error_page 419 = @verification_api;
        if ($request_method = POST) { return 418; }
        return 419;
    }

    location = /api/restaurants/course-routes {
        error_page 418 = @public_api;
        error_page 419 = @verification_api;
        if ($request_method = POST) { return 418; }
        return 419;
    }

    location = /api/restaurants/natural-language-search {
        error_page 418 = @public_api;
        error_page 419 = @verification_api;
        if ($request_method = POST) { return 418; }
        return 419;
    }

    location @public_api {
        proxy_pass http://masiton_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location @verification_api {
        auth_request /_verification/session;
        error_page 401 = /_verification/access-required;
        # auth_request는 하위 요청의 503을 상위 요청에서 500으로 바꾸므로 계약상
        # 503 JSON Adapter로 명시적으로 복원한다. 어떤 경우에도 우회 허용하지 않는다.
        error_page 500 503 = /_verification/unavailable;

        proxy_pass http://masiton_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # /api와 /api/**는 모두 같은 백엔드 경계로 보낸다. 특히 X-Forwarded-For는
    # 외부 요청 헤더를 이어 붙이지 않고 Nginx가 관측한 peer 주소로 덮어써야
    # 관리자 로그인 rate-limit이 클라이언트가 조작한 출처를 신뢰하지 않는다.
    location = /api {
        auth_request /_verification/session;
        error_page 401 = /_verification/access-required;
        error_page 500 503 = /_verification/unavailable;
        proxy_pass http://masiton_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location @validation_login {
        return 302 "/verification/login#returnTo=$request_uri";
    }

    location /api/ {
        auth_request /_verification/session;
        error_page 401 = /_verification/access-required;
        # auth_request는 하위 요청의 503을 상위 요청에서 500으로 바꾸므로 계약상
        # 503 JSON Adapter로 명시적으로 복원한다. 어떤 경우에도 우회 허용하지 않는다.
        error_page 500 503 = /_verification/unavailable;

        proxy_pass http://masiton_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 외부 X-Forwarded-For를 신뢰하지 않는다. 관리자 로그인 rate-limit의
        # 출처는 이 서버가 확인한 remote address 하나로만 backend에 전달한다.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        auth_request /_verification/session;
        # fragment는 서버에 재전송되지 않으면서 원래 query string의 `&`까지 보존한다.
        # 로그인 화면의 client helper가 안전한 상대 경로인지 다시 검증한다.
        error_page 401 = @validation_login;
        error_page 500 503 = /_verification/unavailable;

        proxy_pass http://masiton_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Server Component가 백엔드를 직접 호출할 때 요청 출처별 호출 제한을
        # 유지할 수 있도록, 외부 요청 값을 신뢰하지 않고 Nginx가 직접 덮어쓴다.
        proxy_set_header X-Masiton-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
