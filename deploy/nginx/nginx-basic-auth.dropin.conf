# nginx.service drop-in — M2-11.
# 설치 위치: /etc/systemd/system/nginx.service.d/10-masiton-basic-auth.conf
#
# htpasswd를 tmpfs에 두므로 Nginx가 뜨기 전에 매번 렌더링해야 한다. 배포판
# nginx.service를 직접 고치지 않고 drop-in으로 얹어 패키지 업데이트에 덮이지
# 않게 한다.
#
# reload(systemctl reload nginx)는 ExecStartPre를 다시 실행하지 않지만, 그때는
# 이미 렌더링된 파일이 /run에 있으므로 문제가 없다.

[Service]
Environment=AWS_REGION=ap-northeast-2
ExecStartPre=/opt/masiton/bin/basic-auth-render.sh
