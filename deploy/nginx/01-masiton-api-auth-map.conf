# /api/ 경로의 Basic Auth 요구 여부 판정 — M2-12.
#
# M2-11 제한 공개(Basic Auth)와 관리자 JWT가 같은 `Authorization` 헤더를 쓴다.
# 브라우저는 앱이 `Authorization: Bearer`를 지정하면 Basic 자격 증명을 붙이지 않으므로
# Bearer를 실은 요청은 Basic 검사를 통과할 수 없다. Nginx가 자격 증명 없는 요청으로
# 보고 401로 끊어 백엔드에 도달하지 않는다. 관리자 등록 4종과 로그아웃이 운영
# 브라우저에서 전부 막혀 있던 원인이다.
#
# 그래서 `/api/admin/**`에서 Bearer를 실은 요청만 Basic을 면제한다. 이 경로는
# 백엔드가 JWT와 `ADMIN` 역할을 강제하므로(NFR-SECURITY-001) 면제해도 무인증 노출이
# 생기지 않는다. 자격 증명 없이 Bearer만 붙여 들어온 요청은 백엔드가 401로 거부한다.
#
# 로그인과 재발급은 JWT를 요구하지 않는 무인증 경로여서 예외를 먼저 둔다. Bearer를
# 임의로 붙여 Basic을 우회하고 인터넷에서 자격 증명 시도를 반복하는 것을 막는다.
# 로그아웃은 같은 URI의 `DELETE`지만 Bearer를 싣기 때문에 두 번째 규칙에서 면제된다.
#
# 공개 GET 3종은 `/api/admin/`으로 시작하지 않아 어느 규칙에도 걸리지 않고 기본값으로
# Basic을 계속 요구한다. 제한 공개 범위는 그대로다.
#
# 정규식 항목은 정의된 순서대로 평가된다. 순서를 바꾸면 로그인 예외가 무력해진다.
map "$request_method:$uri:$http_authorization" $masiton_api_realm {
    "~*^POST:/api/admin/auth/tokens(/refresh)?:"  "masiton verification";
    "~*^[A-Z]+:/api/admin/.*:Bearer "             off;
    default                                       "masiton verification";
}
