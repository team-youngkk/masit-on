# 운영 EC2의 Nginx 최상위 설정 — M2-08.
# Amazon Linux 2023 배포판 기본 설정(nginx 1.30.3)에서 두 가지를 뺐다.
#   - `/usr/share/nginx/html`을 서비스하는 기본 server 블록. 도메인 밖 접근에
#     배포판 기본 페이지가 응답하지 않게 한다. 알려지지 않은 Host 처리는
#     masiton.click.conf의 default_server가 맡는다.
#   - 주석으로만 있던 TLS server 예시. 실제 TLS 설정은 masiton.click.conf에 있다.
# 그 밖의 값은 배포판 기본을 유지한다.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    # M2-10 지표 산출용 JSON 로그. CloudWatch 지표 필터가 status와 request_time을
    # 필드로 읽어 오류율과 p95 알람을 만든다. 기본 `main` 포맷에는 응답 시간이 없어
    # p95를 계산할 수 없었다.
    #
    # 요청·응답 본문은 남기지 않는다. ADR-OBS-001 11장이 금지하며 14일 보관 기준에서
    # 로그량이 예산을 압박한다.
    log_format masiton_json escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"upstream_status":"$upstream_status",'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent"'
        '}';

    access_log  /var/log/nginx/access.log  masiton_json;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    # 응답 헤더와 오류 페이지에 Nginx 버전을 싣지 않는다.
    server_tokens off;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Webhook is application-authenticated but deliberately bypasses browser auth.
    limit_req_zone $binary_remote_addr zone=masiton_ungated:1m rate=10r/s;

    include /etc/nginx/conf.d/*.conf;
}
