# 운영 EC2의 Nginx 최상위 설정 — M2-08.
# Amazon Linux 2023 배포판 기본 설정(nginx 1.30.3)에서 두 가지를 뺐다.
#   - `/usr/share/nginx/html`을 서비스하는 기본 server 블록. 도메인 밖 접근에
#     배포판 기본 페이지가 응답하지 않게 한다. 알려지지 않은 Host 처리는
#     masiton.click.conf의 default_server가 맡는다.
#   - 주석으로만 있던 TLS server 예시. 실제 TLS 설정은 masiton.click.conf에 있다.
# 그 밖의 값은 배포판 기본을 유지한다.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    # 응답 헤더와 오류 페이지에 Nginx 버전을 싣지 않는다.
    server_tokens off;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    include /etc/nginx/conf.d/*.conf;
}
