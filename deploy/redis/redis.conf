# 운영 Redis 8.8 설정 — M2-05.
# 사양 근거: docs/08-planning/m2-cost-and-sizing.md 5.4절, ADR-DATA-005 6·10·11절.
#
# 이 파일에는 비밀값이 없다. `requirepass`는 기동 시점에 Parameter Store에서 읽어
# tmpfs(/run)에 렌더링한 사본에만 붙인다(deploy/scripts/redis-render-conf.sh).
# 디스크에 남는 설정 파일에 자격 증명을 두지 않기 위한 것이다(NFR-SECURITY-003).

port 6379

# 컨테이너 내부의 전 인터페이스에 바인딩하고, 호스트 노출은 docker publish를
# `127.0.0.1:6379`로 제한해 막는다. 컨테이너 네트워크 밖으로 나가는 경로가
# loopback 하나뿐이므로 VPC 다른 호스트에서도 도달하지 않는다.
bind 0.0.0.0
protected-mode yes

# 영속화. AOF를 everysec으로 두고 RDB 스냅샷을 함께 남긴다.
# 두 파일 모두 호스트 볼륨(/opt/masiton/redis/data)에 저장돼 컨테이너 교체와
# 인스턴스 재기동을 넘어 유지된다.
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
dbfilename dump.rdb
dir /data
save 900 1
save 300 10
save 60 10000

# RDB 저장이 실패하면 쓰기를 거부한다. 인증 상태가 조용히 유실되는 것보다
# 실패를 드러내는 쪽이 낫다.
stop-writes-on-bgsave-error yes

# auth:refresh:*·auth:login-failure:*가 축출 대상이 되지 않게 한다.
# 상한에 닿으면 쓰기가 오류로 실패하며, 그 실패는 fail-closed로 처리된다
# (ADR-DATA-005 12절).
maxmemory 256mb
maxmemory-policy noeviction

loglevel notice
logfile ""
