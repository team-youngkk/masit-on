# 운영 프로파일 — M2-09.
#
# 비밀값은 환경 변수로 받지 않는다. Docker가 컨테이너 환경 변수를
# `/var/lib/docker/containers/<id>/config.v2.json`에 평문으로 기록하므로
# `docker inspect`로 개인키를 읽을 수 있고 루트 볼륨 스냅샷에도 함께 들어간다.
# ADR-SEC-001 11절의 평문 저장 금지에 걸린다.
#
# 대신 파일에서 읽는다. 그 파일들은 운영 EC2의 tmpfs(`/run/masiton/secrets`)에 기동
# 직전 렌더링되고 컨테이너에 읽기 전용으로 마운트된다
# (deploy/scripts/app-secrets-render.sh). tmpfs이므로 디스크에 남지 않고 재기동하면
# 사라진다. Redis `requirepass`에도 같은 방식을 쓴다.
#
# `configtree:`는 디렉터리의 파일 하나를 속성 하나로 읽는다. **파일 이름이 곧 속성
# 이름이다.** 그래서 이 파일에는 비밀 속성을 선언하지 않는다. 선언하면 값이 아니라
# 플레이스홀더라도 프로파일 계층이 키 재료를 담은 것으로 취급된다
# (ConfigurationLayeringTest, 구현 컨벤션 4.5절).
#
# 렌더링되는 파일 이름은 다음과 같다. 바꾸면 렌더링 스크립트도 함께 바꾼다.
#   spring.datasource.password
#   spring.data.redis.password
#   masiton.security.jwt.key-id
#   masiton.security.jwt.private-key-pem
#   masiton.security.jwt.public-key-pem
#   masiton.member.action-mail.active-key-id
#   masiton.member.action-mail.active-key
#   masiton.member.action-mail.from-address
#   masiton.member.rate-limit.secret
#   spring.mail.username
#   spring.mail.password
#   masiton.security.verification.login-id
#   masiton.security.verification.password-hash
#   masiton.integration.kakao.rest-api-key   (선택)
#   masiton.integration.youtube.api-key      (선택)
#   masiton.integration.kakao-mobility.rest-api-key (선택)
#   masiton.ai.provider.gemini.api-key       (선택)
#   masiton.ai.youtube-webhook.secret       (선택)
#   masiton.ai.temporary-input.active-key-id (선택)
#   masiton.ai.temporary-input.active-key    (선택)
#   masiton.ai.temporary-input.keys.<key-id> (키 교체 중 미종결 작업용 과거 키, 선택·prefix 렌더링)
#
# `optional:`을 붙이지 않는다. 디렉터리가 없으면 기동이 실패해야 한다. 조용히 넘어가면
# 접속값 없이 뜨거나 공통 설정의 빈 기본값으로 붙는다.
spring:
  config:
    import: configtree:${SECRETS_DIR:/run/masiton/secrets}/
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
  data:
    redis:
      # 배포 고도화 운영에서는 앱 ASG와 분리된 사설 subnet 전용 Redis endpoint에 붙는다
      # (ADR-DATA-005 6절, ADR-DEPLOY-005). ADR-RUNTIME-001 11절이 운영 설정의
      # Docker 서비스명을 금지하므로 `redis` 같은 컨테이너 이름을 쓰지 않는다.
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  # 운영 백엔드는 `--network host`로 실행되므로(deploy/scripts/app-run.sh) 바인딩 주소를
  # 지정하지 않으면 호스트의 모든 인터페이스에 붙는다. 그러면 보안 그룹·방화벽 규칙 하나가
  # 8080을 여는 순간 Nginx를 건너뛴 인터넷 직결이 성립하고, 인터넷에 공개하지 않기로 한
  # `/internal/**`까지 함께 노출된다(ADR-WEB-005 2절, ADR-WEB-003 6.5절 상태 확인 경로).
  #
  # 상태 확인이 이 커넥터에 함께 올라가 있어야 이 한 줄로 `/internal/**`까지 덮인다.
  # 공통 설정이 `management.server.port`를 두지 않아 listener가 하나뿐이다. 관리 포트를
  # 분리하면 `management.server.address`도 같이 loopback으로 고정해야 한다.
  #
  # loopback에만 바인딩해 그 경로를 네트워크 계층에서 없앤다. 8080에 접근하는 정당한
  # 호출자는 모두 같은 인스턴스의 127.0.0.1이다. Nginx upstream(deploy/nginx/masiton.click.conf),
  # 프론트엔드 `API_BASE_URL`, 상태 지표 수집(deploy/scripts/health-metrics.sh)이 그렇다.
  # `--network host`이므로 컨테이너 안의 127.0.0.1이 호스트 loopback과 같다.
  #
  # 환경 변수 placeholder를 두지 않는다. 운영에서 이 값을 넓히는 것은 설정 실수로 일어날
  # 일이 아니라 경계 변경이므로 ADR-WEB-005와 함께 바꿔야 한다. 다만 placeholder를 뺀 것만으로는
  # 부족하다. OS 환경 변수가 이 파일보다 우선하므로 `SERVER_ADDRESS`를 컨테이너에 전달하면
  # 값이 뒤집힌다. app-run.sh가 그것을 전달하지 않는 것까지 AppRunScriptContractTest가 고정한다.
  address: 127.0.0.1

masiton:
  ai:
    youtube-webhook:
      subscription-hub-url: ${YOUTUBE_SUBSCRIPTION_HUB_URL:https://pubsubhubbub.appspot.com/subscribe}
      callback-url: ${YOUTUBE_WEBHOOK_CALLBACK_URL}
  integration:
    # 운영은 실제 제공자 호스트를 쓴다. WireMock은 local 프로파일 전용이다.
    kakao:
      base-url: ${KAKAO_BASE_URL:https://dapi.kakao.com}
    youtube:
      base-url: ${YOUTUBE_BASE_URL:https://www.googleapis.com}
    kakao-mobility:
      # quota·계약 확인 전에는 기본값으로 hard stop한다(ADR-ROUTE-001 9절, NFR-COST-001).
      enabled: ${KAKAO_MOBILITY_ENABLED:false}
      free-tier-verified: ${KAKAO_MOBILITY_FREE_TIER_VERIFIED:false}
      paid-billing-enabled: false
      base-url: ${KAKAO_MOBILITY_BASE_URL:https://apis-navi.kakaomobility.com}
      local-base-url-allowed: false
