spring:
  application:
    name: masit-on
  datasource:
    hikari:
      # 상태 확인이 저장소 장애를 유한 시간 안에 DOWN으로 보고해야 하므로 기본값(30s)보다 낮춘다.
      # 콜드 스타트 동시 기동을 견디도록 여유를 둔 값이다. (NFR-AVAILABILITY-001)
      connection-timeout: 10000
  data:
    redis:
      # 같은 이유로 유한 상한을 둔다. Redis는 Refresh Token 조회 경로라 지연 허용치가 더 짧다.
      timeout: 2s
      connect-timeout: 2s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  task:
    scheduling:
      # AI polling은 별도 aiWorkerTaskScheduler를 사용하고, 나머지 예약 작업은 이 기본 풀을 사용한다.
      pool:
        size: 1

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /internal
      exposure:
        include: health
  endpoint:
    health:
      access: read_only
      show-details: never
      show-components: always
      group:
        live:
          include: ping
        ready:
          include: db
        dependencies:
          include: ${DEPENDENCY_HEALTH_COMPONENTS:db,redis}
  health:
    defaults:
      enabled: false
    ping:
      enabled: true
    db:
      enabled: true
    redis:
      enabled: true
    mail:
      # 로컬·테스트는 SMTP 없이 기동하고 운영 배포만 연결·인증 상태를 dependencies에 포함한다.
      enabled: ${MAIL_HEALTH_ENABLED:false}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.masiton: ${LOG_LEVEL_APP:INFO}

masiton:
  ai:
    place-identity:
      # 이름 완화 판정은 운영에서 기본 활성화하며, 긴급 차단 시 환경 변수로 false를 주입한다.
      relaxed-matching-enabled: ${AI_PLACE_IDENTITY_RELAXED_MATCHING_ENABLED:true}
    worker:
      enabled: ${AI_WORKER_ENABLED:false}
      poll-interval: PT5S
      lease-duration: PT120S
      heartbeat-interval: PT30S
      drain-timeout: PT30S
      max-attempts: 3
      first-backoff: PT5S
      second-backoff: PT30S
      quota-window: ${AI_WORKER_QUOTA_WINDOW:P1D}
      # Both limits must be verified from the active model/account before enabling the worker.
      provider-quota-limit: ${AI_WORKER_PROVIDER_QUOTA_LIMIT:0}
      application-quota-limit: ${AI_WORKER_APPLICATION_QUOTA_LIMIT:0}
      quota-warning-percent: 80
    youtube-webhook:
      max-payload-bytes: ${YOUTUBE_WEBHOOK_MAX_PAYLOAD_BYTES:65536}
      secret: ${YOUTUBE_WEBHOOK_SECRET:}
      subscription-hub-url: ${YOUTUBE_SUBSCRIPTION_HUB_URL:https://pubsubhubbub.appspot.com/subscribe}
      callback-url: ${YOUTUBE_WEBHOOK_CALLBACK_URL:http://localhost:8080/api/webhooks/youtube/channel-updates}
    temporary-input:
      active-key-id: ${AI_TEMPORARY_INPUT_KEY_ID:}
      active-key: ${AI_TEMPORARY_INPUT_KEY:}
      # 키 교체 중에는 외부 설정의 keys.<key-id>에 미종결 작업용 과거 키를 함께 유지한다.
    provider:
      gemini:
        # Calls remain blocked unless an environment explicitly verifies the Free Tier gate.
        enabled: ${GEMINI_ENABLED:false}
        free-tier-verified: ${GEMINI_FREE_TIER_VERIFIED:false}
        paid-billing-enabled: ${GEMINI_PAID_BILLING_ENABLED:false}
        # Production credentials are supplied by the existing configtree secret mount, never a URL or default profile.
        api-key:
        base-url: https://generativelanguage.googleapis.com
        model: gemini-3.5-flash-lite
        prompt-version: P8
        schema-version: S2
        connect-timeout: PT5S
        response-timeout: PT90S
  integration:
    kakao-mobility:
      # ADR-ROUTE-001 9절·NFR-COST-001: quota·계약이 확인되지 않으면 기본값으로 hard stop한다.
      enabled: ${KAKAO_MOBILITY_ENABLED:false}
      free-tier-verified: ${KAKAO_MOBILITY_FREE_TIER_VERIFIED:false}
      paid-billing-enabled: false
      rest-api-key: ${KAKAO_MOBILITY_REST_API_KEY:}
      base-url: ${KAKAO_MOBILITY_BASE_URL:https://apis-navi.kakaomobility.com}
      connect-timeout: PT1S
      response-timeout: PT4S
      total-timeout: PT5S
      monthly-quota: ${KAKAO_MOBILITY_MONTHLY_QUOTA:1000}
      requests-per-second: ${KAKAO_MOBILITY_REQUESTS_PER_SECOND:20}
      max-concurrent-requests: ${KAKAO_MOBILITY_MAX_CONCURRENT_REQUESTS:20}
      local-base-url-allowed: false
  personalization:
    recent-cleanup:
      cron: ${RECENT_RESTAURANT_CLEANUP_CRON:0 0 3 * * *}
      zone: ${RECENT_RESTAURANT_CLEANUP_ZONE:UTC}
  restaurant:
    map:
      rate-limit:
        trusted-proxy-addresses: ${RESTAURANT_MAP_TRUSTED_PROXY_ADDRESSES:}
        reverse-proxy-enabled: ${RESTAURANT_MAP_REVERSE_PROXY_ENABLED:false}
  member:
    action-mail:
      active-key-id: ${MEMBER_ACTION_MAIL_ACTIVE_KEY_ID:}
      active-key: ${MEMBER_ACTION_MAIL_ACTIVE_KEY:}
      from-address: ${MEMBER_ACTION_MAIL_FROM_ADDRESS:}
      password-reset-url: ${PASSWORD_RESET_PUBLIC_URL:http://localhost:3000/password-reset}
    rate-limit:
      secret: ${MEMBER_RATE_LIMIT_SECRET:}
      trusted-proxy-addresses: ${MEMBER_TRUSTED_PROXY_ADDRESSES:}
      reverse-proxy-enabled: ${MEMBER_REVERSE_PROXY_ENABLED:false}
  security:
    verification:
      enabled: ${VERIFICATION_ENABLED:true}
      login-id: ${VERIFICATION_LOGIN_ID:}
      password-hash: ${VERIFICATION_PASSWORD_HASH:}
      public-base-url: ${VERIFICATION_PUBLIC_BASE_URL:http://localhost:3000}
      cookie-name: __Host-masiton-verification
      session-ttl: P7D
      failure-ttl: PT15M
      max-attempts: 5
      trusted-proxy-addresses: ${VERIFICATION_TRUSTED_PROXY_ADDRESSES:}
      reverse-proxy-enabled: ${VERIFICATION_REVERSE_PROXY_ENABLED:false}
    jwt:
      issuer: masit-on
      audience: masit-on-api
      access-token-ttl: PT30M
      key-id: ${JWT_KEY_ID:}
      private-key-pem: ${JWT_PRIVATE_KEY_PEM:}
      public-key-pem: ${JWT_PUBLIC_KEY_PEM:}
    refresh-token-ttl: P14D
    cookie-name: __Secure-masiton-refresh
    secure: true
    same-site: Strict
    path: /api/auth/tokens
    member:
      refresh-token-ttl: P14D
      cookie-name: __Secure-masiton-refresh
      path: /api/auth/tokens
      public-base-url: ${AUTH_ALLOWED_ORIGINS:http://localhost:3000}
      max-sessions: 3
    login-failure:
      max-attempts: 5
      ttl: PT15M
      trusted-proxy-addresses: ${AUTH_LOGIN_TRUSTED_PROXY_ADDRESSES:}
      reverse-proxy-enabled: ${AUTH_LOGIN_REVERSE_PROXY_ENABLED:false}
