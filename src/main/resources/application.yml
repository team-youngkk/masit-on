spring:
  application:
    name: masit-on
  datasource:
    hikari:
      # 상태 확인이 저장소 장애를 유한 시간 안에 DOWN으로 보고해야 하므로 기본값(30s)보다 낮춘다.
      # 콜드 스타트 동시 기동을 견디도록 여유를 둔 값이다. (NFR-AVAILABILITY-001)
      connection-timeout: 10000
  data:
    redis:
      # 같은 이유로 유한 상한을 둔다. Redis는 Refresh Token 조회 경로라 지연 허용치가 더 짧다.
      timeout: 2s
      connect-timeout: 2s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /internal
      exposure:
        include: health
  endpoint:
    health:
      access: read_only
      show-details: never
      show-components: always
      group:
        live:
          include: ping
        ready:
          include: db
        dependencies:
          include: ${DEPENDENCY_HEALTH_COMPONENTS:db,redis}
  health:
    defaults:
      enabled: false
    ping:
      enabled: true
    db:
      enabled: true
    redis:
      enabled: true
    mail:
      # 로컬·테스트는 SMTP 없이 기동하고 운영 배포만 연결·인증 상태를 dependencies에 포함한다.
      enabled: ${MAIL_HEALTH_ENABLED:false}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.masiton: ${LOG_LEVEL_APP:INFO}

masiton:
  ai:
    youtube-webhook:
      max-payload-bytes: ${YOUTUBE_WEBHOOK_MAX_PAYLOAD_BYTES:65536}
    temporary-input:
      active-key-id: ${AI_TEMPORARY_INPUT_KEY_ID:}
      active-key: ${AI_TEMPORARY_INPUT_KEY:}
    provider:
      gemini:
        # Calls remain blocked unless an environment explicitly verifies the Free Tier gate.
        enabled: ${GEMINI_ENABLED:false}
        free-tier-verified: ${GEMINI_FREE_TIER_VERIFIED:false}
        paid-billing-enabled: ${GEMINI_PAID_BILLING_ENABLED:false}
        # Production credentials are supplied by the existing configtree secret mount, never a URL or default profile.
        api-key:
        base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
        model: gemini-3-flash-preview
        prompt-version: P1
        schema-version: S1
        connect-timeout: PT5S
        response-timeout: PT90S
  personalization:
    recent-cleanup:
      cron: ${RECENT_RESTAURANT_CLEANUP_CRON:0 0 3 * * *}
      zone: ${RECENT_RESTAURANT_CLEANUP_ZONE:UTC}
  restaurant:
    map:
      rate-limit:
        trusted-proxy-addresses: ${RESTAURANT_MAP_TRUSTED_PROXY_ADDRESSES:}
        reverse-proxy-enabled: ${RESTAURANT_MAP_REVERSE_PROXY_ENABLED:false}
  member:
    action-mail:
      active-key-id: ${MEMBER_ACTION_MAIL_ACTIVE_KEY_ID:}
      active-key: ${MEMBER_ACTION_MAIL_ACTIVE_KEY:}
    rate-limit:
      secret: ${MEMBER_RATE_LIMIT_SECRET:}
      trusted-proxy-addresses: ${MEMBER_TRUSTED_PROXY_ADDRESSES:}
      reverse-proxy-enabled: ${MEMBER_REVERSE_PROXY_ENABLED:false}
  security:
    verification:
      login-id: ${VERIFICATION_LOGIN_ID:}
      password-hash: ${VERIFICATION_PASSWORD_HASH:}
      public-base-url: ${VERIFICATION_PUBLIC_BASE_URL:http://localhost:3000}
      cookie-name: __Host-masiton-verification
      session-ttl: P7D
      failure-ttl: PT15M
      max-attempts: 5
      trusted-proxy-addresses: ${VERIFICATION_TRUSTED_PROXY_ADDRESSES:}
      reverse-proxy-enabled: ${VERIFICATION_REVERSE_PROXY_ENABLED:false}
    jwt:
      issuer: masit-on
      audience: masit-on-admin-api
      member-audience: masit-on-member-api
      access-token-ttl: PT30M
      member-access-token-ttl: PT30M
      key-id: ${JWT_KEY_ID:}
      private-key-pem: ${JWT_PRIVATE_KEY_PEM:}
      public-key-pem: ${JWT_PUBLIC_KEY_PEM:}
    refresh-token-ttl: P14D
    cookie-name: masit_on_refresh
    secure: true
    same-site: Strict
    path: /api/admin/auth
    member:
      refresh-token-ttl: P14D
      cookie-name: __Secure-masiton-member-refresh
      path: /api/auth/tokens
      public-base-url: ${MEMBER_PUBLIC_BASE_URL:http://localhost:3000}
      max-sessions: 3
    login-failure:
      max-attempts: 5
      ttl: PT15M
