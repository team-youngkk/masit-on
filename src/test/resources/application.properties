# 테스트는 항상 test 프로파일로 실행해 application-test.yml이 공통 설정(application.yml) 위에
# 테스트 전용 값만 덮어쓰게 한다. Gradle 태스크 설정이 아니라 이 파일에 두는 이유는 IDE에서
# 테스트를 단건 실행할 때도 같은 프로파일이 적용돼야 하기 때문이다.
#
# 이 값을 application.yml로 옮기지 않는다. Spring Boot는 classpath:/application.yml을 단일
# 리소스로 해석하므로 테스트 리소스에 같은 이름의 파일을 두면 공통 설정 전체가 가려지고
# spring.jpa.open-in-view=false, spring.jpa.hibernate.ddl-auto=validate 같은 운영 불변값이
# 테스트 환경에서 사라진다. 파일 이름이 달라야 두 파일이 함께 로드된다.
spring.profiles.active=test
