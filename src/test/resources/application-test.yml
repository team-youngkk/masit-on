spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/masiton
    username: masiton
    password: masiton_local
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  data:
    redis:
      host: localhost
      port: 6379

masiton:
  member:
    action-mail:
      # Test-only AES-256 material; it is not used outside the test profile.
      from-address: no-reply@test.masiton.invalid
      active-key-id: test-1
      active-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    rate-limit:
      secret: test-only-member-rate-limit-secret
  integration:
    # 테스트는 닫힌 포트를 가리켜 실패 시 실제 Kakao/YouTube로 나가지 않고 즉시 연결 실패로
    # fail closed 한다. WireMock이 필요한 테스트는 @DynamicPropertySource로 실제 URL을 덮어쓴다.
    kakao:
      base-url: http://localhost:1
      allowed-origins: http://localhost:1,http://127.0.0.1:1,http://wiremock:8080
      rest-api-key: test-only-non-secret-key
    youtube:
      base-url: http://localhost:1
      allowed-origins: http://localhost:1,http://127.0.0.1:1,http://wiremock:8080
      api-key: test-only-non-secret-key
    kakao-mobility:
      enabled: true
      free-tier-verified: true
      rest-api-key: test-only-non-secret-key
      base-url: http://localhost:1
      local-base-url-allowed: true
