# ADR-RUNTIME-001 13절 이미지 검증과 ECR push.
# 품질 게이트(ci.yml)와 파일을 분리한 이유는 두 가지다.
#   - ci.yml은 모든 브랜치에 적용되는 공통 게이트이고 develop이 소유한다. 여기에 M2
#     전용 ECR·OIDC 단계를 섞으면 develop과 배포 브랜치가 계속 어긋난다.
#   - 이미지 생성·push는 ADR-CI-001 9절이 M2부터 적용한다고 범위를 나눴다.
#
# workflow_run으로 ci.yml 성공 뒤에만 실행한다. 빌드·테스트가 하나라도 실패하면
# 이 워크플로에 도달하지 않으므로 push와 배포가 차단된다.
name: Images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - main
      - 'deploy/**'

permissions:
  contents: read

concurrency:
  group: images-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 711457211155.dkr.ecr.ap-northeast-2.amazonaws.com
  # workflow_run에서 github.sha는 기본 브랜치 head를 가리킨다.
  # 검사 대상 커밋을 명시적으로 잡아야 이미지 태그와 실제 소스가 일치한다.
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

jobs:
  build-verify-push:
    name: 이미지 빌드·검증·push
    # CI가 통과한 커밋만 이미지로 만든다.
    if: github.event.workflow_run.conclusion == 'success'
    # 운영 EC2가 arm64(t4g.medium)이므로 같은 아키텍처에서 빌드한다.
    # 공개 저장소는 arm64 러너를 무료로 쓸 수 있어 QEMU 에뮬레이션이 필요 없다.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # ADR-RUNTIME-001 13절: 베이스 이미지가 명시 태그(운영은 digest)를 쓰는지 대조한다.
      # digest 없이 태그만 쓴 FROM이 하나라도 있으면 실패시킨다.
      - name: 베이스 이미지 digest 고정 검사
        run: |
          set -euo pipefail
          status=0
          for dockerfile in Dockerfile frontend/Dockerfile; do
            while read -r line; do
              case "$line" in
                *@sha256:*) ;;
                *) echo "digest 미고정: $dockerfile -> $line"; status=1 ;;
              esac
            done < <(grep -E '^FROM ' "$dockerfile")
          done
          if [ "$status" -ne 0 ]; then
            echo '베이스 이미지는 태그와 digest를 함께 고정해야 한다.'
            exit 1
          fi
          echo 'FROM 전부 digest 고정 확인'

      - name: 백엔드 이미지 빌드
        run: docker build -t "masiton-backend:${IMAGE_TAG}" -f Dockerfile .

      - name: 프론트엔드 이미지 빌드
        run: docker build -t "masiton-frontend:${IMAGE_TAG}" -f frontend/Dockerfile frontend

      # ADR-RUNTIME-001 13절: 이미지에 평문 비밀값이나 .env가 포함되지 않았는지 검사한다.
      # 하나라도 걸리면 push에 도달하지 않는다.
      # 검사 결과를 파이프로 넘기지 않고 변수에 담아 판정한다.
      # `docker run ... | grep -q .`는 grep이 첫 매치에서 종료하며 docker에 SIGPIPE를
      # 보내고, pipefail이 그 141을 파이프라인 상태로 잡는다. 그러면 `if`가 거짓으로
      # 판정해 **실제로 비밀값을 찾았는데도 통과**하게 된다. 검사가 조용히 무력화되는
      # 방향의 실패라 파이프를 쓰지 않는다.
      - name: 이미지 비밀값·실행 사용자 검증
        run: |
          set -euo pipefail
          for image in "masiton-backend:${IMAGE_TAG}" "masiton-frontend:${IMAGE_TAG}"; do
            echo "=== $image ==="

            # 검사는 --user 0:0으로 실행한다. 이미지의 기본 사용자(uid 1001)로 `find /`를
            # 돌리면 읽을 수 없는 경로에서 오류가 나 결과가 0건이어도 exit 1이 된다.
            # 2>/dev/null은 메시지만 숨기고 종료 코드를 바꾸지 않는다.
            #
            # root로 돌리면 권한 오류가 사라져 종료 코드를 신뢰할 수 있고, 기본 사용자가
            # 읽지 못하는 경로까지 검사 범위에 들어온다. 검사 전용 실행이며 이미지의
            # USER 지시자는 그대로다(아래 비루트 실행 확인이 그것을 검증한다).
            #
            # root 실행으로 권한 오류가 없어졌으므로 결과가 0건이면 find가 exit 0이다.
            # 그래서 `|| true`가 필요하지 않다. 붙이면 docker나 sh 실패까지 성공으로 바꿔
            # 검사가 수행되지 않았는데도 통과한다.
            env_hits=$(docker run --rm --user 0:0 --entrypoint sh "$image" -c \
              "find / -xdev -name '.env' -o -xdev -name '.env.*'")
            if [ -n "$env_hits" ]; then
              echo '.env 파일이 이미지에 포함됐다'
              printf '%s\n' "$env_hits"
              exit 1
            fi
            echo '.env 미포함 확인'

            # grep -rIl은 미검출이 exit 1이고 오류는 exit 2 이상이다. docker 자체 실패는
            # 125 이상이다. 따라서 1만 정상으로 처리하고 나머지는 workflow를 실패시킨다.
            set +e
            secret_hits=$(docker run --rm --user 0:0 --entrypoint sh "$image" -c \
              "grep -rIl -e 'BEGIN PRIVATE KEY' -e 'BEGIN RSA PRIVATE KEY' -e 'JWT_PRIVATE_KEY_PEM' -e 'POSTGRES_PASSWORD' /app")
            grep_status=$?
            set -e
            if [ "$grep_status" -gt 1 ]; then
              echo "비밀값 검사 실행이 실패했다 (exit ${grep_status}). 미검출로 처리하지 않는다."
              exit 1
            fi
            if [ -n "$secret_hits" ]; then
              echo '평문 비밀값 패턴이 이미지에 포함됐다'
              printf '%s\n' "$secret_hits"
              exit 1
            fi
            echo '평문 비밀값 패턴 미포함 확인'

            uid=$(docker run --rm --entrypoint id "$image" -u)
            if [ "$uid" = "0" ]; then
              echo "root로 실행된다 (uid=$uid)"
              exit 1
            fi
            echo "비루트 실행 확인 (uid=$uid)"
          done

      # 여기까지가 자격 증명 없이 수행하는 검증이다.
      # OIDC 신뢰 정책이 refs/heads/deploy/m2와 refs/heads/main만 허용하므로
      # 그 밖의 브랜치는 push 단계에서 자격 증명을 받지 못한다.
      - name: AWS 자격 증명 (OIDC, 장기 키 없음)
        if: github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'deploy/m2'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::711457211155:role/masiton-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        if: github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'deploy/m2'
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      # 태그는 커밋 SHA를 쓴다. `latest`는 기술 정책 3절이 금지한다.
      # 리포지토리가 IMMUTABLE이라 같은 SHA를 다시 push할 수 없다.
      - name: 이미지 push와 digest 기록
        if: github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'deploy/m2'
        run: |
          set -euo pipefail
          {
            echo '## 게시된 이미지'
            echo
            echo "커밋 \`${IMAGE_TAG}\`"
            echo
            echo '| 리포지토리 | 태그 | digest |'
            echo '|---|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"

          for name in backend frontend; do
            remote_tag="${ECR_REGISTRY}/masiton-${name}:${IMAGE_TAG}"
            docker tag "masiton-${name}:${IMAGE_TAG}" "$remote_tag"
            docker push "$remote_tag"

            digest=$(aws ecr describe-images \
              --repository-name "masiton-${name}" \
              --image-ids "imageTag=${IMAGE_TAG}" \
              --query 'imageDetails[0].imageDigest' --output text)
            echo "masiton-${name} digest: ${digest}"
            echo "| masiton-${name} | \`${IMAGE_TAG}\` | \`${digest}\` |" >> "$GITHUB_STEP_SUMMARY"
          done
