# ADR-CI-001 빌드·테스트 품질 게이트.
# 모든 PR과 통합 브랜치 push에서 고정 런타임으로 빌드·자동 테스트를 실행하고
# 실패한 변경을 차단한다.
#
# 이미지 빌드·검증·Docker Hub push와 운영 배포는 M2부터 활성화하는 범위다(ADR-DEPLOY-002,
# ADR-CI-001). 같은 워크플로에 두는 이유는 아래 images·ssh-deploy job 주석에 있다.
# images·ssh-deploy는 배포 대상 브랜치에서만 돌고 PR과 develop push에서는 실행되지 않으며,
# workflow_dispatch의 배포 대상은 별도의 프론트엔드 프로덕션 의존성 감사 job을 거친다.
# 운영 배포 경로는 단일 x86 EC2 공인 IP SSH다.
name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  # 배포 대상 커밋을 직접 지정하는 입력 경로다. push 트리거만으로는 배포 job이 항상
  # 현재 실행의 커밋을 배포하게 되어, 장애 시 직전 digest로 되돌리려면 승인 게이트
  # 밖에서 배포를 수동 실행해야 한다. 롤백도 같은 경로를 쓰도록 하는 #78 완료 조건이다.
  #
  # 이 경로도 배포 job의 `environment: production` 승인을 그대로 거친다. 승인 없이는
  # job이 시작되지 않으므로 게이트를 우회하는 경로가 아니다.
  workflow_dispatch:
    inputs:
      image_tag:
        description: '배포할 커밋 SHA 40자. 비우면 선택한 브랜치의 현재 커밋을 배포한다'
        required: false
        type: string

permissions:
  contents: read

# PR 검증은 같은 ref의 새 커밋이 오면 이전 실행을 취소한다. 운영 배포는 외부
# 취소나 새 실행이 원격 배포 명령을 방치할 수 있어 자동 취소하지 않는다.
#
# 운영 push와 workflow_dispatch는 같은 production 그룹으로 직렬화해 SSH 배포가
# 겹치지 않게 한다. PR은 별도 그룹에서 기존처럼 새 실행이 우선한다.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || (github.ref == 'refs/heads/main' && 'ci-production-deploy' || format('ci-ci-{0}', github.ref)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tracked-secrets:
    name: 추적 파일 RSA 개인키 검사
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: secret scan 회귀 테스트
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File ./scripts/check-tracked-secrets.Tests.ps1

      - name: 최종 tracked tree secret scan
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File ./scripts/check-tracked-secrets.ps1 -RepositoryRoot "$env:GITHUB_WORKSPACE"

  terraform-contract:
    name: Terraform 렌더링 계약
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Redis user-data는 Terraform templatefile()과 Bash가 함께 해석한다.
      # 고정된 Terraform 버전으로 실제 렌더링 결과를 검사해 plan 단계의 보간
      # 회귀를 PR 품질 게이트에서 차단한다.
      - name: Redis template 렌더링 테스트
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/infra/production/terraform-redis/tests/template-render \
            hashicorp/terraform@sha256:9a42ea97ea25b363f4c65be25b9ca52b1e511ea5bf7d56050a506ad2daa7af9d test

      - name: Production Terraform backend 없이 초기화·검증
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/infra/production/terraform \
            --entrypoint sh \
            hashicorp/terraform@sha256:9a42ea97ea25b363f4c65be25b9ca52b1e511ea5bf7d56050a506ad2daa7af9d \
            -c 'terraform init -backend=false && terraform validate'

  # workflow_dispatch는 이미 게시된 이미지를 배포하는 경로다. backend·frontend job은
  # 실행 커밋의 현재 소스를 검사하므로 이 경로에서 건너뛰고, 아래 dispatch audit job이
  # 실제 배포 대상 image_tag의 프론트엔드 package-lock.json을 검사한다. 롤백·재배포가
  # 오래된 이미지의 취약한 의존성을 다시 배포하는 우회 경로가 되지 않게 하는 별도 게이트다.
  backend:
    name: 백엔드 빌드·테스트
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 공유 Redis endpoint 셸 계약
        run: ./deploy/scripts/tests/redis-endpoint-contract-test.sh

      - name: Redis S3 비밀값 렌더링 셸 계약
        run: ./deploy/scripts/tests/redis-render-conf-s3-test.sh

      # ADR-CI-001 9·10절과 기술 정책 3절이 CI 런타임을 JDK 21.0.12로 고정한다.
      # `21`처럼 major만 주면 setup-java가 최신 21.x를 고를 수 있어 저장소 변경 없이
      # CI 런타임이 달라진다. 패치까지 명시한다.
      # Gradle은 Wrapper만 사용하며 시스템 Gradle로 우회하지 않는다(CLAUDE.md 5절).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: gradle

      # 통합 테스트는 Testcontainers로 PostgreSQL·Redis를 실행 시점에 띄운다.
      # ubuntu 러너에는 Docker가 이미 있어 추가 서비스 컨테이너가 필요하지 않다.
      - name: 빌드와 자동화 테스트
        run: ./gradlew --no-daemon clean build

      # 실패 원인을 PR에서 바로 확인할 수 있어야 게이트가 쓸모 있다.
      - name: 테스트 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 14

  frontend:
    name: 프론트엔드 빌드·타입 검사
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # ADR-CI-001 9·10절이 고정 런타임(Node 24.18.0)에서 프론트엔드 빌드를 요구한다.
      #
      # setup-node로 러너에 Node를 깔고 `npm run build`를 돌리면 `next build`가
      # 정적 페이지 생성 단계에서 오류 메시지 없이 exit 1로 죽는다. 같은 명령이 아래
      # 컨테이너에서는 통과한다. 두 환경의 차이는 npm이다. setup-node는 Node 버전만
      # 고정하고 npm은 러너 이미지가 정하므로 저장소가 고정한 값이 아니다. 실제로
      # 러너와 컨테이너의 npm 경고 문구가 달랐다. 즉 이 조합은 고정 런타임이 아니다.
      #
      # `next build`가 오류를 남기지 않아 실패의 근본 원인은 격리하지 못했다.
      # 원인을 모른 채 러너에 우회를 넣는 대신, ADR이 고정한 Node와 그에 번들된 npm을
      # digest까지 못박아 그 안에서 빌드한다. 로컬 컨테이너 실행, CI, 운영 이미지가
      # 모두 같은 Node 24.18.0 + npm 11.16.0을 쓴다.
      #
      # digest를 바꿀 때는 태그도 함께 바꾼다. 한쪽만 바꾸면 빌드가 실패하거나
      # 의도와 다른 이미지를 쓴다.
      #
      # `npm audit`는 package-lock.json에 고정된 프로덕션 의존성만 검사하고 high 이상을
      # 발견하면 0이 아닌 코드로 끝난다. 감사와 빌드를 같은 고정 런타임의 단일 명령
      # 체인으로 실행해 취약한 산출물이 다음 단계로 넘어가지 않게 한다.
      # `npm run build`는 `tsc --noEmit && next build`라 타입 검사와 프로덕션 빌드를
      # 한 번에 수행한다. next.config.ts가 Next 내장 TypeScript 단계를 끄고 있어
      # 타입 검사는 이 tsc가 담당한다.
      - name: 프로덕션 의존성 감사·타입 검사와 프로덕션 빌드 (고정 런타임)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/frontend":/app \
            -w /app \
            node:24.18.0-alpine@sha256:a0b9bf06e4e6193cf7a0f58816cc935ff8c2a908f81e6f1a95432d679c54fbfd \
            sh -c 'npm ci && npm audit --omit=dev --audit-level=high && npm run build'

  # workflow_dispatch에서만 실행한다. dispatch의 image_tag는 현재 워크플로 소스와
  # 다를 수 있으므로, 반드시 배포 job과 같은 대상(image_tag 또는 github.sha)을
  # 검증·checkout한 뒤 고정 Node 런타임으로 package-lock.json을 감사한다.
  frontend-dispatch-audit:
    name: dispatch 프론트엔드 프로덕션 의존성 감사
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: 배포 대상 커밋 SHA 검증
        id: target
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}
        run: |
          set -euo pipefail
          case "$IMAGE_TAG" in
            "" | *[!0-9a-f]*)
              echo "커밋 SHA는 소문자 16진수 40자여야 한다: '${IMAGE_TAG}'" >&2
              exit 1
              ;;
          esac
          if [ "${#IMAGE_TAG}" -ne 40 ]; then
            echo "커밋 SHA는 40자여야 한다 (${#IMAGE_TAG}자): '${IMAGE_TAG}'" >&2
            exit 1
          fi
          printf 'image_tag=%s\n' "$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.target.outputs.image_tag }}

      - name: 프로덕션 의존성 감사 (고정 런타임)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/frontend":/app \
            -w /app \
            node:24.18.0-alpine@sha256:a0b9bf06e4e6193cf7a0f58816cc935ff8c2a908f81e6f1a95432d679c54fbfd \
            sh -c 'npm ci && npm audit --omit=dev --audit-level=high'

  images:
    name: 이미지 빌드·검증·push
    # 빌드·테스트가 하나라도 실패하면 이 job에 도달하지 않는다.
    # ADR-RUNTIME-001 13절과 M2-06 완료 조건이 요구하는 차단이다.
    needs: [backend, frontend, terraform-contract, tracked-secrets]
    #
    # 배포 대상 브랜치의 push에서만 실행한다. 세 가지를 동시에 만족시키기 위한 조건이다.
    #
    #   1. 배포 권한 상승 차단. push 이벤트는 저장소 내부 main에서만 발생하고,
    #      PR·workflow_dispatch에는 이 job이 실행되지 않는다.
    #   2. ADR-CI-001 9절의 "이미지 생성·push는 M2부터" 범위. develop push와 PR에서는
    #      이 job이 실행되지 않는다.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    # 운영 EC2가 x86_64(t2 계열)이므로 같은 아키텍처에서 빌드한다.
    # x86_64 러너에서 빌드해 런타임의 아키텍처 불일치를 막는다.
    runs-on: ubuntu-24.04
    outputs:
      backend_ref: ${{ steps.publish.outputs.backend_ref }}
      frontend_ref: ${{ steps.publish.outputs.frontend_ref }}
    permissions:
      contents: read
    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # ADR-RUNTIME-001 13절: 베이스 이미지가 명시 태그(운영은 digest)를 쓰는지 대조한다.
      # digest 없이 태그만 쓴 FROM이 하나라도 있으면 실패시킨다.
      - name: 베이스 이미지 digest 고정 검사
        run: |
          set -euo pipefail
          status=0
          for dockerfile in Dockerfile frontend/Dockerfile; do
            while read -r line; do
              case "$line" in
                *@sha256:*) ;;
                *) echo "digest 미고정: $dockerfile -> $line"; status=1 ;;
              esac
            done < <(grep -E '^FROM ' "$dockerfile")
          done
          if [ "$status" -ne 0 ]; then
            echo '베이스 이미지는 태그와 digest를 함께 고정해야 한다.'
            exit 1
          fi
          echo 'FROM 전부 digest 고정 확인'

      - name: 백엔드 이미지 빌드
        run: docker build -t "masiton-backend:${IMAGE_TAG}" -f Dockerfile .

      # ADR-LANG-001 13절: 이미지의 `java -version`이 정확히 21.0.12인지 대조한다.
      # 베이스 이미지를 갱신하다 다른 패치로 넘어가면 여기서 막는다.
      - name: 런타임 JDK 패치 버전 대조
        run: |
          set -euo pipefail
          expected='21.0.12'
          # `| head -1`을 쓰면 head가 첫 줄을 읽고 종료하면서 java에 SIGPIPE가 가고,
          # pipefail이 그 141을 파이프라인 상태로 잡아 step이 실패한다.
          # 출력을 변수에 담은 뒤 첫 줄을 꺼내면 파이프가 없어 이 문제가 없다.
          version_output=$(docker run --rm --entrypoint java "masiton-backend:${IMAGE_TAG}" -version 2>&1)
          actual=${version_output%%$'\n'*}
          echo "이미지 java -version: ${actual}"
          case "$actual" in
            *"\"${expected}\""*) echo "JDK ${expected} 확인" ;;
            *) echo "ADR-LANG-001이 요구하는 ${expected}가 아니다"; exit 1 ;;
          esac

      # Kakao Maps JavaScript 키는 빌드 시점에 클라이언트 번들로 들어간다. 런타임
      # 환경 변수로는 바뀌지 않으므로 여기서 넘기지 않으면 지도가 항상 오류 상태로
      # 배포된다. 값이 비면 빌드를 멈춘다. 조용히 통과하면 배포는 성공으로 끝나고
      # 지도만 죽은 이미지가 나간다.
      #
      # Secret이 아니라 변수를 쓴다. ADR-MAP-001 6.5가 이 키를 브라우저 노출
      # 식별자로 분류하고 허용 도메인 제한을 보호 수단으로 삼는다. Secret으로 두면
      # 로그 마스킹이 붙어 값이 맞는지 확인할 수단만 사라진다.
      # SEO 사이트 URL과 GA4 측정 ID도 브라우저에 노출되는 공개값이므로 Secret이 아닌
      # 저장소 변수로 전달한다. 운영 SEO를 위해 사이트 URL은 canonical과 정확히 일치해야 한다.
      - name: 프론트엔드 이미지 빌드
        env:
          KAKAO_MAPS_JS_KEY: ${{ vars.NEXT_PUBLIC_KAKAO_MAPS_JS_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${KAKAO_MAPS_JS_KEY}" ]; then
            echo '저장소 변수 NEXT_PUBLIC_KAKAO_MAPS_JS_KEY가 비어 있다.'
            echo '이 값 없이 빌드하면 지도 화면이 SDK 오류 상태로 배포된다.'
            exit 1
          fi
          if [ "${NEXT_PUBLIC_SITE_URL}" != 'https://masiton.click' ]; then
            echo '저장소 변수 NEXT_PUBLIC_SITE_URL은 canonical https://masiton.click 이어야 한다.'
            exit 1
          fi
          docker build \
            --build-arg "NEXT_PUBLIC_KAKAO_MAPS_JS_KEY=${KAKAO_MAPS_JS_KEY}" \
            --build-arg "NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}" \
            --build-arg "NEXT_PUBLIC_GA_MEASUREMENT_ID=${NEXT_PUBLIC_GA_MEASUREMENT_ID}" \
            -t "masiton-frontend:${IMAGE_TAG}" -f frontend/Dockerfile frontend

      # ADR-RUNTIME-001 13절: 이미지에 평문 비밀값이나 .env가 포함되지 않았는지 검사한다.
      # 하나라도 걸리면 push에 도달하지 않는다.
      # 검사 결과를 파이프로 넘기지 않고 변수에 담아 판정한다.
      # `docker run ... | grep -q .`는 grep이 첫 매치에서 종료하며 docker에 SIGPIPE를
      # 보내고, pipefail이 그 141을 파이프라인 상태로 잡는다. 그러면 `if`가 거짓으로
      # 판정해 **실제로 비밀값을 찾았는데도 통과**하게 된다. 검사가 조용히 무력화되는
      # 방향의 실패라 파이프를 쓰지 않는다.
      - name: 이미지 비밀값·실행 사용자 검증
        run: |
          set -euo pipefail
          for image in "masiton-backend:${IMAGE_TAG}" "masiton-frontend:${IMAGE_TAG}"; do
            echo "=== $image ==="

            # 검사는 --user 0:0으로 실행한다. 이미지의 기본 사용자(uid 1001)로 `find /`를
            # 돌리면 읽을 수 없는 경로에서 오류가 나 결과가 0건이어도 exit 1이 된다.
            # 2>/dev/null은 메시지만 숨기고 종료 코드를 바꾸지 않는다.
            #
            # root로 돌리면 권한 오류가 사라져 종료 코드를 신뢰할 수 있고, 기본 사용자가
            # 읽지 못하는 경로까지 검사 범위에 들어온다. 검사 전용 실행이며 이미지의
            # USER 지시자는 그대로다(아래 비루트 실행 확인이 그것을 검증한다).
            #
            # root 실행으로 권한 오류가 없어졌으므로 결과가 0건이면 find가 exit 0이다.
            # 그래서 `|| true`가 필요하지 않다. 붙이면 docker나 sh 실패까지 성공으로 바꿔
            # 검사가 수행되지 않았는데도 통과한다.
            env_hits=$(docker run --rm --user 0:0 --entrypoint sh "$image" -c \
              "find / -xdev -name '.env' -o -xdev -name '.env.*'")
            if [ -n "$env_hits" ]; then
              echo '.env 파일이 이미지에 포함됐다'
              printf '%s\n' "$env_hits"
              exit 1
            fi
            echo '.env 미포함 확인'

            # 검사를 컨테이너 안에서 grep으로 하지 않는다. `grep -rIl`의 `-I`가 바이너리를
            # 건너뛰므로 백엔드 이미지의 /app에 application.jar 하나만 있는 구성에서는
            # JAR 리소스에 개인키가 들어가도 통과한다. 그래서 /app을 러너로 꺼내
            # JAR까지 풀어 검사한다.
            #
            # BOOT-INF/lib은 검사에서 뺀다. 서드파티 라이브러리가 시험용 키 파일을
            # 담고 있어 오탐을 만든다. 우리가 막아야 하는 것은 우리 소스·리소스가
            # 비밀값을 싣고 나가는 경우이므로 BOOT-INF/classes와 그 밖의 항목을 본다.
            work=$(mktemp -d)
            # extracted를 미리 만든다. 프론트엔드 이미지에는 JAR이 없어 이 디렉터리가
            # 생기지 않고, 존재하지 않는 경로를 받은 grep은 exit 2를 반환해 아래 가드가
            # 검사 실행 실패로 판정한다.
            mkdir -p "$work/extracted"
            cid=$(docker create "$image")
            docker cp "$cid:/app" "$work/app"
            docker rm "$cid" >/dev/null

            for jar in $(find "$work/app" -name '*.jar' -type f); do
              extract="$work/extracted/$(basename "$jar")"
              mkdir -p "$extract"
              # BOOT-INF/lib을 제외하고 푼다. unzip은 일치 항목이 없으면 exit 11이므로
              # 그 경우만 정상으로 처리한다.
              set +e
              unzip -q -o "$jar" -x 'BOOT-INF/lib/*' -d "$extract"
              unzip_status=$?
              set -e
              if [ "$unzip_status" -gt 1 ] && [ "$unzip_status" -ne 11 ]; then
                echo "JAR 해제가 실패했다 ($jar, exit ${unzip_status}). 미검출로 처리하지 않는다."
                exit 1
              fi
              echo "  JAR 해제: $(basename "$jar") -> $(find "$extract" -type f | wc -l)개 파일"
            done

            # --binary-files=text로 바이너리도 내용을 검사한다. 미검출은 exit 1이고
            # 오류는 2 이상이므로 1만 정상으로 처리한다.
            #
            # 패턴은 값 자체를 식별할 수 있고 오탐이 없는 것만 쓴다.
            #
            # 환경 변수 이름(`JWT_PRIVATE_KEY_PEM`)이나 로컬 기본값(`masiton_local`)을
            # 패턴에 넣으면 항상 걸린다. 이미지에는 `${JWT_PRIVATE_KEY_PEM:}` 플레이스홀더가
            # 담긴 application.yml과 로컬 기본값을 담은 application-local.yml이 정상적으로
            # 들어 있다. 둘 다 저장소에 공개된 값이고 운영은 prod 프로파일을 쓴다.
            # JAR 내부까지 보게 되면서 드러난 오탐이라 패턴을 좁혔다.
            #
            # 남긴 세 패턴은 그 자체로 유출을 뜻한다. 개인키 PEM 블록, AWS 장기 액세스
            # 키(ADR-SEC-001이 발급을 금지한다), Slack Webhook URL이다.
            set +e
            secret_hits=$(grep -rlE --binary-files=text \
              -e '-----BEGIN( RSA| EC| OPENSSH| DSA)? PRIVATE KEY-----' \
              -e 'AKIA[0-9A-Z]{16}' \
              -e 'hooks\.slack\.com/services/' \
              --exclude='*.jar' "$work/app" "$work/extracted" 2>/dev/null)
            grep_status=$?
            set -e
            if [ "$grep_status" -gt 1 ]; then
              echo "비밀값 검사 실행이 실패했다 (exit ${grep_status}). 미검출로 처리하지 않는다."
              exit 1
            fi
            if [ -n "$secret_hits" ]; then
              echo '평문 비밀값 패턴이 이미지에 포함됐다'
              printf '%s\n' "$secret_hits"
              exit 1
            fi
            echo "평문 비밀값 패턴 미포함 확인 (검사 파일 $(find "$work/app" "$work/extracted" -type f 2>/dev/null | wc -l)개)"
            rm -rf "$work"

            uid=$(docker run --rm --entrypoint id "$image" -u)
            if [ "$uid" = "0" ]; then
              echo "root로 실행된다 (uid=$uid)"
              exit 1
            fi
            echo "비루트 실행 확인 (uid=$uid)"
          done

      # ADR-RUNTIME-001 13절 취약점 검사.
      #
      # 레지스트리 게시 이후의 scan만으로는 게시 전 차단을 보장할 수 없다.
      # 완료 조건이 "실패하면 push와 배포가 차단된다"이므로 게시 전에 판정해야 한다.
      #
      # --ignore-unfixed로 수정 버전이 없는 CVE는 제외한다. 베이스 이미지의 미수정
      # CVE까지 차단하면 우리가 조치할 수 없는 이유로 배포가 멈추고, 결국 기준을
      # 낮추게 되어 게이트가 무력화된다. 조치 가능한 것만 막는다.
      #
      # Trivy 버전은 태그와 digest로 고정한다. 기술 정책 3절이 `latest`를 금지한다.
      - name: 취약점 검사
        run: |
          set -euo pipefail
          for image in "masiton-backend:${IMAGE_TAG}" "masiton-frontend:${IMAGE_TAG}"; do
            echo "=== $image ==="
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v trivy-db:/root/.cache/trivy \
              aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
              image \
                --scanners vuln \
                --severity CRITICAL,HIGH \
                --ignore-unfixed \
                --exit-code 1 \
                "$image"
          done
          echo '수정 가능한 CRITICAL·HIGH 취약점 없음'

      # 여기까지가 Docker Hub 자격 증명 없이 수행하는 검증이다.
      # push token은 게시 단계에서만 주입하고, digest ref만 job output으로 넘긴다.
      - name: Docker Hub 로그인
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PUSH_TOKEN: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/masiton-dockerhub-push
        run: |
          set -euo pipefail
          install -d -m 0700 "$DOCKER_CONFIG"
          [ -n "$DOCKERHUB_USERNAME" ] || { echo 'DOCKERHUB_USERNAME secret이 비어 있다' >&2; exit 1; }
          [ -n "$DOCKERHUB_PUSH_TOKEN" ] || { echo 'DOCKERHUB_PUSH_TOKEN secret이 비어 있다' >&2; exit 1; }
          [[ "$DOCKERHUB_NAMESPACE" =~ ^[a-z0-9][a-z0-9_.-]{0,254}$ ]] || {
            echo '저장소 변수 DOCKERHUB_NAMESPACE 형식이 올바르지 않다' >&2
            exit 1
          }
          printf '%s' "$DOCKERHUB_PUSH_TOKEN" | docker login docker.io \
            --username "$DOCKERHUB_USERNAME" --password-stdin >/dev/null

      # 태그는 커밋 SHA를 쓴다. `latest`는 기술 정책 3절이 금지한다.
      # Docker Hub tag는 digest로 다시 조회해 배포 output에는 immutable ref만 기록한다.
      - name: 이미지 push와 digest 기록
        id: publish
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/masiton-dockerhub-push
        run: |
          set -euo pipefail
          {
            echo '## 게시된 이미지'
            echo
            echo "커밋 \`${IMAGE_TAG}\`"
            echo
            echo '| 리포지토리 | 태그 | digest | 상태 |'
            echo '|---|---|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"

          cleanup() {
            docker logout docker.io >/dev/null 2>&1 || true
            rm -rf "$DOCKER_CONFIG"
          }
          trap cleanup EXIT

          for name in backend frontend; do
            repo="masiton-${name}"
            local_image="${repo}:${IMAGE_TAG}"
            remote_tag="docker.io/${DOCKERHUB_NAMESPACE}/${repo}:${IMAGE_TAG}"
            docker tag "$local_image" "$remote_tag"
            docker push "$remote_tag" >/dev/null
            docker pull "$remote_tag" >/dev/null
            repo_digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$remote_tag")
            digest="${repo_digest##*@}"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "${repo}: registry digest 형식이 올바르지 않다" >&2
              exit 1
            }
            reference="docker.io/${DOCKERHUB_NAMESPACE}/${repo}@${digest}"
            echo "${repo}: push 완료 (${digest})"

            echo "| ${repo} | \`${IMAGE_TAG}\` | \`${digest}\` | 게시 완료 |" >> "$GITHUB_STEP_SUMMARY"
            echo "${name}_ref=${reference}" >> "$GITHUB_OUTPUT"
          done

      - name: 로컬 Docker Hub 인증 정리
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/masiton-dockerhub-push
        run: |
          set -euo pipefail
          docker logout docker.io >/dev/null 2>&1 || true
          rm -rf "$DOCKER_CONFIG"

  # 단일 x86 EC2 운영 배포 — Docker Hub immutable digest를 SSH로 전달한다.
  # push와 workflow_dispatch 모두 production 승인을 거친다.
  ssh-deploy:
    name: Docker Hub 이미지 SSH 배포
    needs: [images, frontend-dispatch-audit]
    if: >-
      always() &&
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'push' &&
          needs.images.result == 'success' &&
          needs['frontend-dispatch-audit'].result == 'skipped') ||
        (github.event_name == 'workflow_dispatch' &&
          needs.images.result == 'skipped' &&
          needs['frontend-dispatch-audit'].result == 'success')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    env:
      IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
      PRODUCTION_HOST: ${{ vars.PRODUCTION_HOST }}
      PRODUCTION_SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
      PUBLISHED_BACKEND_IMAGE_REF: ${{ needs.images.outputs.backend_ref }}
      PUBLISHED_FRONTEND_IMAGE_REF: ${{ needs.images.outputs.frontend_ref }}
    steps:
      # rollback 실행도 당시 커밋의 배포 스크립트를 함께 사용한다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: 배포 입력 및 이미지 digest 검증
        id: resolve
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PULL_TOKEN: ${{ secrets.DOCKERHUB_PULL_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/masiton-dockerhub-dispatch
        run: |
          set -euo pipefail
          case "$IMAGE_TAG" in
            "" | *[!0-9a-f]*)
              echo "커밋 SHA는 소문자 16진수 40자여야 한다: '$IMAGE_TAG'" >&2
              exit 1
              ;;
          esac
          if [ "${#IMAGE_TAG}" -ne 40 ]; then
            echo "커밋 SHA는 40자여야 한다 (match: ${#IMAGE_TAG}자): '$IMAGE_TAG'" >&2
            exit 1
          fi
          if [[ ! "$DOCKERHUB_NAMESPACE" =~ ^[a-z0-9][a-z0-9_.-]{0,254}$ ]]; then
            echo "DOCKERHUB_NAMESPACE 형식이 올바르지 않다" >&2
            exit 1
          fi
          if [[ ! "$DOCKERHUB_USERNAME" =~ ^[a-z0-9][a-z0-9_.-]{0,254}$ ]]; then
            echo "DOCKERHUB_USERNAME 형식이 올바르지 않다" >&2
            exit 1
          fi
          if [ -z "$DOCKERHUB_PULL_TOKEN" ]; then
            echo "DOCKERHUB_PULL_TOKEN이 비어 있다" >&2
            exit 1
          fi
          backend_ref="$PUBLISHED_BACKEND_IMAGE_REF"
          frontend_ref="$PUBLISHED_FRONTEND_IMAGE_REF"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            install -d -m 0700 "$DOCKER_CONFIG"
            cleanup() {
              docker logout docker.io >/dev/null 2>&1 || true
              rm -rf "$DOCKER_CONFIG"
            }
            trap cleanup EXIT
            printf '%s' "$DOCKERHUB_PULL_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin >/dev/null
            for name in backend frontend; do
              image="docker.io/${DOCKERHUB_NAMESPACE}/masiton-${name}:${IMAGE_TAG}"
              docker pull "$image" >/dev/null
              ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
              if [[ ! "$ref" =~ ^docker[.]io/[a-z0-9][a-z0-9_.-]{0,254}/masiton-${name}@sha256:[0-9a-f]{64}$ ]]; then
                echo "$name 이미지 digest를 확인하지 못했다" >&2
                exit 1
              fi
              if [ "$name" = backend ]; then backend_ref="$ref"; else frontend_ref="$ref"; fi
            done
          fi
          if [[ ! "$backend_ref" =~ ^docker[.]io/[a-z0-9][a-z0-9_.-]{0,254}/masiton-backend@sha256:[0-9a-f]{64}$ ]]; then
            echo "backend 이미지 digest ref 형식이 올바르지 않다" >&2
            exit 1
          fi
          if [[ ! "$frontend_ref" =~ ^docker[.]io/[a-z0-9][a-z0-9_.-]{0,254}/masiton-frontend@sha256:[0-9a-f]{64}$ ]]; then
            echo "frontend 이미지 digest ref 형식이 올바르지 않다" >&2
            exit 1
          fi
          if [ -z "$PRODUCTION_HOST" ] || [[ ! "$PRODUCTION_HOST" =~ ^([0-9]{1,3}[.]){3}[0-9]{1,3}$ ]]; then
            echo "PRODUCTION_HOST는 public IPv4 주소여야 한다" >&2
            exit 1
          fi
          IFS=. read -r octet1 octet2 octet3 octet4 <<< "$PRODUCTION_HOST"
          for octet in "$octet1" "$octet2" "$octet3" "$octet4"; do
            if (( 10#$octet > 255 )); then
              echo "PRODUCTION_HOST IPv4 octet이 올바르지 않다" >&2
              exit 1
            fi
          done
          case "$PRODUCTION_HOST" in
            0.*|10.*|127.*|169.254.*|192.168.*|172.1[6-9].*|172.2[0-9].*|172.3[0-1].*)
              echo "PRODUCTION_HOST는 public IPv4 주소여야 한다: 사설·예약 대역" >&2
              exit 1
              ;;
          esac
          if [[ ! "$PRODUCTION_SSH_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]; then
            echo "PRODUCTION_SSH_USER 형식이 올바르지 않다" >&2
            exit 1
          fi
          echo "backend_ref=$backend_ref" >> "$GITHUB_OUTPUT"
          echo "frontend_ref=$frontend_ref" >> "$GITHUB_OUTPUT"
          echo "배포 대상: $PRODUCTION_HOST ($PRODUCTION_SSH_USER), 이미지 tag: $IMAGE_TAG"

      - name: 배포 bundle 생성
        id: bundle
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/masiton-deploy-${GITHUB_RUN_ID}.tgz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf "$bundle" \
            deploy/scripts/app-deploy.sh \
            deploy/scripts/dockerhub-app-deploy.sh \
            deploy/scripts/app-run.sh \
            deploy/scripts/app-secrets-render.sh \
            deploy/scripts/runtime-health.sh \
            deploy/scripts/observability-cleanup.sh \
            deploy/scripts/nginx-install.sh \
            deploy/scripts/nginx-smoke.sh \
            deploy/scripts/tls-deploy-cert.sh \
            deploy/app/masiton-backend.service \
            deploy/app/masiton-frontend.service \
            deploy/nginx/nginx.conf \
            deploy/nginx/masiton.click.conf \
            deploy/nginx/00-masiton-upgrade-map.conf \
            deploy/nginx/masiton-tls-renew.service \
            deploy/nginx/masiton-tls-renew.timer
          printf 'bundle=%s\n' "$bundle" >> "$GITHUB_OUTPUT"
          printf 'sha256=%s\n' "$(sha256sum "$bundle" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: SSH key와 known_hosts 준비
        id: ssh-files
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "SSH private key와 known_hosts secret이 모두 필요하다" >&2
            exit 1
          fi
          key_file="$RUNNER_TEMP/masiton-production-key"
          known_hosts_file="$RUNNER_TEMP/masiton-production-known-hosts"
          printf '%s' "$SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 0600 "$key_file" "$known_hosts_file"
          ssh-keygen -F "$PRODUCTION_HOST" -f "$known_hosts_file" >/dev/null
          printf 'key_file=%s\n' "$key_file" >> "$GITHUB_OUTPUT"
          printf 'known_hosts_file=%s\n' "$known_hosts_file" >> "$GITHUB_OUTPUT"

      - name: bundle 업로드 및 원격 압축 해제
        env:
          BUNDLE: ${{ steps.bundle.outputs.bundle }}
          BUNDLE_SHA256: ${{ steps.bundle.outputs.sha256 }}
          KEY_FILE: ${{ steps.ssh-files.outputs.key_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh-files.outputs.known_hosts_file }}
        run: |
          set -euo pipefail
          ssh_opts=(
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE"
            -o ConnectTimeout=10
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -i "$KEY_FILE"
          )
          remote="$PRODUCTION_SSH_USER@$PRODUCTION_HOST"
          remote_stage="/tmp/masiton-deploy-${GITHUB_RUN_ID}"
          remote_archive="/tmp/masiton-deploy-${GITHUB_RUN_ID}.tgz"
          ssh "${ssh_opts[@]}" "$remote" "sudo -n install -d -m 0750 '$remote_stage'"
          scp "${ssh_opts[@]}" "$BUNDLE" "$remote:$remote_archive"
          remote_sha256="$(ssh "${ssh_opts[@]}" "$remote" "sha256sum '$remote_archive' | awk '{print \$1}'")"
          if [ "$remote_sha256" != "$BUNDLE_SHA256" ]; then
            echo "원격 bundle checksum이 다르다: $remote_sha256 != $BUNDLE_SHA256" >&2
            exit 1
          fi
          ssh "${ssh_opts[@]}" "$remote" "sudo -n install -m 0600 '$remote_archive' '$remote_stage/payload.tgz' && sudo -n rm -f '$remote_archive' && sudo -n tar -xzf '$remote_stage/payload.tgz' -C '$remote_stage' && sudo -n rm -f '$remote_stage/payload.tgz' && sudo -n find '$remote_stage' -maxdepth 1 -type f -name '*.sh' -exec chmod 0750 {} +"

      - name: 원격 Docker Hub 로그인과 애플리케이션 배포
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PULL_TOKEN: ${{ secrets.DOCKERHUB_PULL_TOKEN }}
          KEY_FILE: ${{ steps.ssh-files.outputs.key_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh-files.outputs.known_hosts_file }}
          BACKEND_IMAGE_REF: ${{ steps.resolve.outputs.backend_ref }}
          FRONTEND_IMAGE_REF: ${{ steps.resolve.outputs.frontend_ref }}
        run: |
          set -euo pipefail
          ssh_opts=(
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE"
            -o ConnectTimeout=10
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -i "$KEY_FILE"
          )
          remote="$PRODUCTION_SSH_USER@$PRODUCTION_HOST"
          remote_stage="/tmp/masiton-deploy-${GITHUB_RUN_ID}"
          printf '%s' "$DOCKERHUB_PULL_TOKEN" | ssh "${ssh_opts[@]}" "$remote" "sudo -n '$remote_stage/dockerhub-app-deploy.sh' '$DOCKERHUB_USERNAME' '$BACKEND_IMAGE_REF' '$FRONTEND_IMAGE_REF' '$remote_stage'"
          {
            echo '## 운영 배포'
            echo
            echo "대상 호스트: $PRODUCTION_HOST"
            echo "커밋: $IMAGE_TAG"
            echo "backend: $BACKEND_IMAGE_REF"
            echo "frontend: $FRONTEND_IMAGE_REF"
            echo '상태: 성공'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 원격 임시 파일 정리
        if: always()
        env:
          KEY_FILE: ${{ steps.ssh-files.outputs.key_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh-files.outputs.known_hosts_file }}
        run: |
          set -euo pipefail
          if [ -z "$KEY_FILE" ] || [ ! -f "$KEY_FILE" ]; then
            exit 0
          fi
          ssh_opts=(
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE"
            -o ConnectTimeout=10
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -i "$KEY_FILE"
          )
          remote="$PRODUCTION_SSH_USER@$PRODUCTION_HOST"
          remote_stage="/tmp/masiton-deploy-${GITHUB_RUN_ID}"
          remote_archive="/tmp/masiton-deploy-${GITHUB_RUN_ID}.tgz"
          ssh "${ssh_opts[@]}" "$remote" "sudo -n rm -rf -- '$remote_stage' '$remote_archive'" || echo '원격 임시 파일 정리에 실패했다' >&2
