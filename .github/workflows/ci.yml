# ADR-CI-001 빌드·테스트 품질 게이트.
# 모든 PR과 통합 브랜치 push에서 고정 런타임으로 빌드·자동 테스트를 실행하고
# 실패한 변경을 차단한다.
#
# 이미지 빌드·검증·ECR push와 운영 배포는 M2부터 활성화하는 범위다(ADR-DEPLOY-002,
# ADR-CI-001). 같은 워크플로에 두는 이유는 아래 images·deploy job 주석에 있다.
# 두 job은 배포 대상 브랜치에서만 돌고 PR과 develop push에서는 실행되지 않는다.
name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - 'deploy/**'
  # 배포 대상 커밋을 직접 지정하는 입력 경로다. push 트리거만으로는 배포 job이 항상
  # 현재 실행의 커밋을 배포하게 되어, 장애 시 직전 digest로 되돌리려면 승인 게이트
  # 밖에서 SSM을 수동 실행해야 한다. 롤백도 같은 경로를 쓰도록 하는 #78 완료 조건이다.
  #
  # 이 경로도 배포 job의 `environment: production` 승인을 그대로 거친다. 승인 없이는
  # job이 시작되지 않으므로 게이트를 우회하는 경로가 아니다.
  workflow_dispatch:
    inputs:
      image_tag:
        description: '배포할 커밋 SHA 40자. 비우면 선택한 브랜치의 현재 커밋을 배포한다'
        required: false
        type: string
      deployment_target:
        description: '배포 대상 입력 계약'
        required: false
        default: instance
        type: choice
        options: [instance, codedeploy]
      codedeploy_application:
        description: 'CodeDeploy application name'
        required: false
        type: string
      codedeploy_deployment_group:
        description: 'CodeDeploy deployment group'
        required: false
        type: string
      codedeploy_s3_bucket:
        description: 'CodeDeploy revision S3 bucket (codedeploy 선택 시 필수)'
        required: false
        type: string

permissions:
  contents: read

# PR 검증은 같은 ref의 새 커밋이 오면 이전 실행을 취소한다. 운영 배포는 외부
# 취소나 새 실행이 원격 CodeDeploy를 방치하지 않도록 자동 취소하지 않는다.
#
# 이벤트 종류를 그룹에 넣어 PR과 push·dispatch 실행을 서로 취소하지 않는다.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  terraform-contract:
    name: Terraform 렌더링 계약
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Redis user-data는 Terraform templatefile()과 Bash가 함께 해석한다.
      # 고정된 Terraform 버전으로 실제 렌더링 결과를 검사해 plan 단계의 보간
      # 회귀를 PR 품질 게이트에서 차단한다.
      - name: Redis template 렌더링 테스트
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/infra/production/terraform-redis/tests/template-render \
            hashicorp/terraform:1.6.6 test

  # workflow_dispatch는 이미 게시된 이미지를 배포하는 경로다. 그 이미지는 push 때
  # 이 두 job을 통과해야 만들어졌으므로 품질 게이트는 이미 걸린 상태이고, 다시 도는
  # 것은 배포 대상이 아닌 브랜치 현재 커밋을 검사하는 일이다. 롤백은 현재 커밋이
  # 문제라서 하는 것이므로 그 검사를 기다리게 하면 복구만 몇 분 늦어진다.
  backend:
    name: 백엔드 빌드·테스트
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # ADR-CI-001 9·10절과 기술 정책 3절이 CI 런타임을 JDK 21.0.12로 고정한다.
      # `21`처럼 major만 주면 setup-java가 최신 21.x를 고를 수 있어 저장소 변경 없이
      # CI 런타임이 달라진다. 패치까지 명시한다.
      # Gradle은 Wrapper만 사용하며 시스템 Gradle로 우회하지 않는다(CLAUDE.md 5절).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: gradle

      # 통합 테스트는 Testcontainers로 PostgreSQL·Redis를 실행 시점에 띄운다.
      # ubuntu 러너에는 Docker가 이미 있어 추가 서비스 컨테이너가 필요하지 않다.
      - name: 빌드와 자동화 테스트
        run: ./gradlew --no-daemon clean build

      # 실패 원인을 PR에서 바로 확인할 수 있어야 게이트가 쓸모 있다.
      - name: 테스트 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 14

  frontend:
    name: 프론트엔드 빌드·타입 검사
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # ADR-CI-001 9·10절이 고정 런타임(Node 24.18.0)에서 프론트엔드 빌드를 요구한다.
      #
      # setup-node로 러너에 Node를 깔고 `npm run build`를 돌리면 `next build`가
      # 정적 페이지 생성 단계에서 오류 메시지 없이 exit 1로 죽는다. 같은 명령이 아래
      # 컨테이너에서는 통과한다. 두 환경의 차이는 npm이다. setup-node는 Node 버전만
      # 고정하고 npm은 러너 이미지가 정하므로 저장소가 고정한 값이 아니다. 실제로
      # 러너와 컨테이너의 npm 경고 문구가 달랐다. 즉 이 조합은 고정 런타임이 아니다.
      #
      # `next build`가 오류를 남기지 않아 실패의 근본 원인은 격리하지 못했다.
      # 원인을 모른 채 러너에 우회를 넣는 대신, ADR이 고정한 Node와 그에 번들된 npm을
      # digest까지 못박아 그 안에서 빌드한다. 로컬 컨테이너 실행, CI, 운영 이미지가
      # 모두 같은 Node 24.18.0 + npm 11.16.0을 쓴다.
      #
      # digest를 바꿀 때는 태그도 함께 바꾼다. 한쪽만 바꾸면 빌드가 실패하거나
      # 의도와 다른 이미지를 쓴다.
      #
      # `npm run build`는 `tsc --noEmit && next build`라 타입 검사와 프로덕션 빌드를
      # 한 번에 수행한다. next.config.ts가 Next 내장 TypeScript 단계를 끄고 있어
      # 타입 검사는 이 tsc가 담당한다.
      - name: 타입 검사와 프로덕션 빌드 (고정 런타임)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/frontend":/app \
            -w /app \
            node:24.18.0-alpine@sha256:a0b9bf06e4e6193cf7a0f58816cc935ff8c2a908f81e6f1a95432d679c54fbfd \
            sh -c 'npm ci && npm run build'

  images:
    name: 이미지 빌드·검증·push
    # 빌드·테스트가 하나라도 실패하면 이 job에 도달하지 않는다.
    # ADR-RUNTIME-001 13절과 M2-06 완료 조건이 요구하는 차단이다.
    needs: [backend, frontend, terraform-contract]
    #
    # 배포 대상 브랜치의 push에서만 실행한다. 세 가지를 동시에 만족시키기 위한 조건이다.
    #
    #   1. OIDC 신뢰 정책 일치. IAM 역할은 refs/heads/main과 refs/heads/deploy/m2만
    #      허용한다. push 이벤트의 OIDC `sub`가 실제 push된 ref이므로 일치한다.
    #      workflow_run으로 분리했을 때는 `sub`가 기본 브랜치(develop)가 되어
    #      AssumeRoleWithWebIdentity가 거절됐다.
    #   2. 권한 상승 차단. workflow_run은 권한 있는 컨텍스트라 fork PR의 head SHA를
    #      체크아웃한 상태로 OIDC를 주면 외부 코드가 우리 ECR에 push할 수 있다.
    #      push 이벤트는 저장소 내부 브랜치에서만 발생해 그 경로가 없다.
    #   3. ADR-CI-001 9절의 "이미지 생성·push는 M2부터" 범위. develop push와 PR에서는
    #      이 job이 실행되지 않는다.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/deploy/m2')
    # 운영 EC2가 arm64(t4g.medium)이므로 같은 아키텍처에서 빌드한다.
    # 공개 저장소는 arm64 러너를 무료로 쓸 수 있어 QEMU 에뮬레이션이 필요 없다.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      ECR_REGISTRY: 711457211155.dkr.ecr.ap-northeast-2.amazonaws.com
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # ADR-RUNTIME-001 13절: 베이스 이미지가 명시 태그(운영은 digest)를 쓰는지 대조한다.
      # digest 없이 태그만 쓴 FROM이 하나라도 있으면 실패시킨다.
      - name: 베이스 이미지 digest 고정 검사
        run: |
          set -euo pipefail
          status=0
          for dockerfile in Dockerfile frontend/Dockerfile; do
            while read -r line; do
              case "$line" in
                *@sha256:*) ;;
                *) echo "digest 미고정: $dockerfile -> $line"; status=1 ;;
              esac
            done < <(grep -E '^FROM ' "$dockerfile")
          done
          if [ "$status" -ne 0 ]; then
            echo '베이스 이미지는 태그와 digest를 함께 고정해야 한다.'
            exit 1
          fi
          echo 'FROM 전부 digest 고정 확인'

      - name: 백엔드 이미지 빌드
        run: docker build -t "masiton-backend:${IMAGE_TAG}" -f Dockerfile .

      # ADR-LANG-001 13절: 이미지의 `java -version`이 정확히 21.0.12인지 대조한다.
      # 베이스 이미지를 갱신하다 다른 패치로 넘어가면 여기서 막는다.
      - name: 런타임 JDK 패치 버전 대조
        run: |
          set -euo pipefail
          expected='21.0.12'
          # `| head -1`을 쓰면 head가 첫 줄을 읽고 종료하면서 java에 SIGPIPE가 가고,
          # pipefail이 그 141을 파이프라인 상태로 잡아 step이 실패한다.
          # 출력을 변수에 담은 뒤 첫 줄을 꺼내면 파이프가 없어 이 문제가 없다.
          version_output=$(docker run --rm --entrypoint java "masiton-backend:${IMAGE_TAG}" -version 2>&1)
          actual=${version_output%%$'\n'*}
          echo "이미지 java -version: ${actual}"
          case "$actual" in
            *"\"${expected}\""*) echo "JDK ${expected} 확인" ;;
            *) echo "ADR-LANG-001이 요구하는 ${expected}가 아니다"; exit 1 ;;
          esac

      # Kakao Maps JavaScript 키는 빌드 시점에 클라이언트 번들로 들어간다. 런타임
      # 환경 변수로는 바뀌지 않으므로 여기서 넘기지 않으면 지도가 항상 오류 상태로
      # 배포된다. 값이 비면 빌드를 멈춘다. 조용히 통과하면 배포는 성공으로 끝나고
      # 지도만 죽은 이미지가 나간다.
      #
      # Secret이 아니라 변수를 쓴다. ADR-MAP-001 6.5가 이 키를 브라우저 노출
      # 식별자로 분류하고 허용 도메인 제한을 보호 수단으로 삼는다. Secret으로 두면
      # 로그 마스킹이 붙어 값이 맞는지 확인할 수단만 사라진다.
      - name: 프론트엔드 이미지 빌드
        env:
          KAKAO_MAPS_JS_KEY: ${{ vars.NEXT_PUBLIC_KAKAO_MAPS_JS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KAKAO_MAPS_JS_KEY}" ]; then
            echo '저장소 변수 NEXT_PUBLIC_KAKAO_MAPS_JS_KEY가 비어 있다.'
            echo '이 값 없이 빌드하면 지도 화면이 SDK 오류 상태로 배포된다.'
            exit 1
          fi
          docker build \
            --build-arg "NEXT_PUBLIC_KAKAO_MAPS_JS_KEY=${KAKAO_MAPS_JS_KEY}" \
            -t "masiton-frontend:${IMAGE_TAG}" -f frontend/Dockerfile frontend

      # ADR-RUNTIME-001 13절: 이미지에 평문 비밀값이나 .env가 포함되지 않았는지 검사한다.
      # 하나라도 걸리면 push에 도달하지 않는다.
      # 검사 결과를 파이프로 넘기지 않고 변수에 담아 판정한다.
      # `docker run ... | grep -q .`는 grep이 첫 매치에서 종료하며 docker에 SIGPIPE를
      # 보내고, pipefail이 그 141을 파이프라인 상태로 잡는다. 그러면 `if`가 거짓으로
      # 판정해 **실제로 비밀값을 찾았는데도 통과**하게 된다. 검사가 조용히 무력화되는
      # 방향의 실패라 파이프를 쓰지 않는다.
      - name: 이미지 비밀값·실행 사용자 검증
        run: |
          set -euo pipefail
          for image in "masiton-backend:${IMAGE_TAG}" "masiton-frontend:${IMAGE_TAG}"; do
            echo "=== $image ==="

            # 검사는 --user 0:0으로 실행한다. 이미지의 기본 사용자(uid 1001)로 `find /`를
            # 돌리면 읽을 수 없는 경로에서 오류가 나 결과가 0건이어도 exit 1이 된다.
            # 2>/dev/null은 메시지만 숨기고 종료 코드를 바꾸지 않는다.
            #
            # root로 돌리면 권한 오류가 사라져 종료 코드를 신뢰할 수 있고, 기본 사용자가
            # 읽지 못하는 경로까지 검사 범위에 들어온다. 검사 전용 실행이며 이미지의
            # USER 지시자는 그대로다(아래 비루트 실행 확인이 그것을 검증한다).
            #
            # root 실행으로 권한 오류가 없어졌으므로 결과가 0건이면 find가 exit 0이다.
            # 그래서 `|| true`가 필요하지 않다. 붙이면 docker나 sh 실패까지 성공으로 바꿔
            # 검사가 수행되지 않았는데도 통과한다.
            env_hits=$(docker run --rm --user 0:0 --entrypoint sh "$image" -c \
              "find / -xdev -name '.env' -o -xdev -name '.env.*'")
            if [ -n "$env_hits" ]; then
              echo '.env 파일이 이미지에 포함됐다'
              printf '%s\n' "$env_hits"
              exit 1
            fi
            echo '.env 미포함 확인'

            # 검사를 컨테이너 안에서 grep으로 하지 않는다. `grep -rIl`의 `-I`가 바이너리를
            # 건너뛰므로 백엔드 이미지의 /app에 application.jar 하나만 있는 구성에서는
            # JAR 리소스에 개인키가 들어가도 통과한다. 그래서 /app을 러너로 꺼내
            # JAR까지 풀어 검사한다.
            #
            # BOOT-INF/lib은 검사에서 뺀다. 서드파티 라이브러리가 시험용 키 파일을
            # 담고 있어 오탐을 만든다. 우리가 막아야 하는 것은 우리 소스·리소스가
            # 비밀값을 싣고 나가는 경우이므로 BOOT-INF/classes와 그 밖의 항목을 본다.
            work=$(mktemp -d)
            # extracted를 미리 만든다. 프론트엔드 이미지에는 JAR이 없어 이 디렉터리가
            # 생기지 않고, 존재하지 않는 경로를 받은 grep은 exit 2를 반환해 아래 가드가
            # 검사 실행 실패로 판정한다.
            mkdir -p "$work/extracted"
            cid=$(docker create "$image")
            docker cp "$cid:/app" "$work/app"
            docker rm "$cid" >/dev/null

            for jar in $(find "$work/app" -name '*.jar' -type f); do
              extract="$work/extracted/$(basename "$jar")"
              mkdir -p "$extract"
              # BOOT-INF/lib을 제외하고 푼다. unzip은 일치 항목이 없으면 exit 11이므로
              # 그 경우만 정상으로 처리한다.
              set +e
              unzip -q -o "$jar" -x 'BOOT-INF/lib/*' -d "$extract"
              unzip_status=$?
              set -e
              if [ "$unzip_status" -gt 1 ] && [ "$unzip_status" -ne 11 ]; then
                echo "JAR 해제가 실패했다 ($jar, exit ${unzip_status}). 미검출로 처리하지 않는다."
                exit 1
              fi
              echo "  JAR 해제: $(basename "$jar") -> $(find "$extract" -type f | wc -l)개 파일"
            done

            # --binary-files=text로 바이너리도 내용을 검사한다. 미검출은 exit 1이고
            # 오류는 2 이상이므로 1만 정상으로 처리한다.
            #
            # 패턴은 값 자체를 식별할 수 있고 오탐이 없는 것만 쓴다.
            #
            # 환경 변수 이름(`JWT_PRIVATE_KEY_PEM`)이나 로컬 기본값(`masiton_local`)을
            # 패턴에 넣으면 항상 걸린다. 이미지에는 `${JWT_PRIVATE_KEY_PEM:}` 플레이스홀더가
            # 담긴 application.yml과 로컬 기본값을 담은 application-local.yml이 정상적으로
            # 들어 있다. 둘 다 저장소에 공개된 값이고 운영은 prod 프로파일을 쓴다.
            # JAR 내부까지 보게 되면서 드러난 오탐이라 패턴을 좁혔다.
            #
            # 남긴 세 패턴은 그 자체로 유출을 뜻한다. 개인키 PEM 블록, AWS 장기 액세스
            # 키(ADR-SEC-001이 발급을 금지한다), Slack Webhook URL이다.
            set +e
            secret_hits=$(grep -rlE --binary-files=text \
              -e '-----BEGIN( RSA| EC| OPENSSH| DSA)? PRIVATE KEY-----' \
              -e 'AKIA[0-9A-Z]{16}' \
              -e 'hooks\.slack\.com/services/' \
              --exclude='*.jar' "$work/app" "$work/extracted" 2>/dev/null)
            grep_status=$?
            set -e
            if [ "$grep_status" -gt 1 ]; then
              echo "비밀값 검사 실행이 실패했다 (exit ${grep_status}). 미검출로 처리하지 않는다."
              exit 1
            fi
            if [ -n "$secret_hits" ]; then
              echo '평문 비밀값 패턴이 이미지에 포함됐다'
              printf '%s\n' "$secret_hits"
              exit 1
            fi
            echo "평문 비밀값 패턴 미포함 확인 (검사 파일 $(find "$work/app" "$work/extracted" -type f 2>/dev/null | wc -l)개)"
            rm -rf "$work"

            uid=$(docker run --rm --entrypoint id "$image" -u)
            if [ "$uid" = "0" ]; then
              echo "root로 실행된다 (uid=$uid)"
              exit 1
            fi
            echo "비루트 실행 확인 (uid=$uid)"
          done

      # ADR-RUNTIME-001 13절 취약점 검사.
      #
      # ECR의 scan-on-push는 이 단계를 대신할 수 없다. 이름 그대로 push된 뒤에
      # 시작하므로 취약한 이미지가 이미 게시된 상태가 된다. 완료 조건이 "실패하면
      # push와 배포가 차단된다"이므로 게시 전에 판정해야 한다.
      #
      # --ignore-unfixed로 수정 버전이 없는 CVE는 제외한다. 베이스 이미지의 미수정
      # CVE까지 차단하면 우리가 조치할 수 없는 이유로 배포가 멈추고, 결국 기준을
      # 낮추게 되어 게이트가 무력화된다. 조치 가능한 것만 막는다.
      #
      # Trivy 버전은 태그와 digest로 고정한다. 기술 정책 3절이 `latest`를 금지한다.
      - name: 취약점 검사
        run: |
          set -euo pipefail
          for image in "masiton-backend:${IMAGE_TAG}" "masiton-frontend:${IMAGE_TAG}"; do
            echo "=== $image ==="
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v trivy-db:/root/.cache/trivy \
              aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
              image \
                --scanners vuln \
                --severity CRITICAL,HIGH \
                --ignore-unfixed \
                --exit-code 1 \
                "$image"
          done
          echo '수정 가능한 CRITICAL·HIGH 취약점 없음'

      # 여기까지가 자격 증명 없이 수행하는 검증이다.
      # 브랜치 제한은 job 수준 `if`가 이미 처리하므로 step마다 반복하지 않는다.
      # 조건을 두 곳에 두면 한쪽만 고쳐 어긋날 수 있다.
      # IAM 역할 신뢰 정책은 GitHub의 immutable subject claim 형식을 기대한다.
      #
      #   repo:team-youngkk@307880221/masit-on@1308471593:ref:refs/heads/deploy/m2
      #
      # 조직·저장소 숫자 ID가 sub에 포함된다. 이름 기반 형식(`repo:owner/repo:ref:...`)으로
      # 정책을 쓰면 AssumeRoleWithWebIdentity가 거절된다. 저장소를 옮기거나 이름을 바꿀
      # 때는 ID가 유지되므로 정책을 고치지 않아도 되고, 이름 재사용 공격에도 안전하다.
      - name: AWS 자격 증명 (OIDC, 장기 키 없음)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::711457211155:role/masiton-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      # 태그는 커밋 SHA를 쓴다. `latest`는 기술 정책 3절이 금지한다.
      # 리포지토리가 IMMUTABLE이라 같은 SHA를 다시 push할 수 없다.
      - name: 이미지 push와 digest 기록
        run: |
          set -euo pipefail
          {
            echo '## 게시된 이미지'
            echo
            echo "커밋 \`${IMAGE_TAG}\`"
            echo
            echo '| 리포지토리 | 태그 | digest | 상태 |'
            echo '|---|---|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"

          # 리포지토리가 IMMUTABLE이라 이미 있는 태그에 push하면 실패한다.
          # 두 이미지를 순차로 올리는 도중 뒤쪽이 실패하면 재실행 시 앞쪽에서 즉시 막혀
          # 뒤쪽을 영구히 복구할 수 없다. 그래서 각 리포지토리를 독립적으로 멱등하게 처리한다.
          #
          # 태그가 커밋 SHA이므로 "이미 있는 태그"는 같은 소스에서 만든 이미지가 이미
          # 게시됐다는 뜻이다. 그때는 push를 건너뛰고 기존 digest를 그대로 기록한다.
          for name in backend frontend; do
            repo="masiton-${name}"
            remote_tag="${ECR_REGISTRY}/${repo}:${IMAGE_TAG}"

            existing=$(aws ecr describe-images \
              --repository-name "$repo" \
              --image-ids "imageTag=${IMAGE_TAG}" \
              --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)

            if [ -n "$existing" ] && [ "$existing" != "None" ]; then
              echo "${repo}: 태그 ${IMAGE_TAG}가 이미 있다. push를 건너뛴다 (${existing})"
              digest="$existing"
              state='이미 게시됨'
            else
              docker tag "${repo}:${IMAGE_TAG}" "$remote_tag"
              docker push "$remote_tag"
              digest=$(aws ecr describe-images \
                --repository-name "$repo" \
                --image-ids "imageTag=${IMAGE_TAG}" \
                --query 'imageDetails[0].imageDigest' --output text)
              echo "${repo}: push 완료 (${digest})"
              state='새로 게시'
            fi

            echo "| ${repo} | \`${IMAGE_TAG}\` | \`${digest}\` | ${state} |" >> "$GITHUB_STEP_SUMMARY"
          done

  # 운영 배포 — #78. ADR-CI-001이 정한 "EC2 배포는 M2부터 활성화, 실제 운영 반영은
  # 수동 승인으로 보호"를 구현한다.
  #
  # 별도 워크플로로 분리하지 않는다. 이미지 job과 순서를 보장하려면 `needs`가 필요하고,
  # 워크플로를 나누면 `workflow_run`에 의존해야 한다. 그 트리거는 기본 브랜치에 파일이
  # 있어야 발동하고 OIDC `sub`가 실제 push된 ref를 가리키지 않아 AssumeRole이 거절된다
  # (images.yml에서 실제로 겪었다. 기록 6.6절).
  #
  # 승인 게이트는 `environment: production`이다. 승인 전에는 job이 시작되지 않으므로
  # 이미지가 게시돼도 배포는 사람의 판단을 기다린다.
  deploy:
    name: 운영 배포
    needs: [images]
    # 두 경로로 들어온다. 어느 쪽이든 배포 대상 브랜치여야 한다. OIDC 신뢰 정책이
    # refs/heads/main과 refs/heads/deploy/m2만 허용하므로 그 밖의 ref는 AssumeRole
    # 단계에서 거절되지만, 승인 요청 자체가 뜨지 않도록 여기서 먼저 막는다.
    #
    #   push               — 이미지 job이 성공해야 한다. 방금 게시한 이미지를 배포한다.
    #   workflow_dispatch  — 이미 게시된 이미지를 배포한다(롤백·재배포). 이미지 job은
    #                        push에서만 도므로 skipped이고, 그래서 `!cancelled()`로
    #                        skipped 의존성을 통과시킨다. 대신 skipped를 명시적으로
    #                        요구해 push 경로에서 이미지 실패가 통과되지 않게 한다.
    if: >-
      !cancelled() &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/deploy/m2') &&
      (
        (github.event_name == 'push' && needs.images.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && needs.images.result == 'skipped')
      )
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      INSTANCE_ID: i-0b451f18bca827cc9
      DEPLOYMENT_TARGET: ${{ github.event.inputs.deployment_target || 'instance' }}
      CODEDEPLOY_APPLICATION: ${{ github.event.inputs.codedeploy_application || '' }}
      CODEDEPLOY_DEPLOYMENT_GROUP: ${{ github.event.inputs.codedeploy_deployment_group || '' }}
      CODEDEPLOY_S3_BUCKET: ${{ github.event.inputs.codedeploy_s3_bucket || '' }}
      # 입력이 있으면 그 커밋을, 없으면 이 실행의 커밋을 배포한다. push 이벤트에는
      # inputs가 없어 항상 github.sha가 된다.
      IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}
    steps:
      - uses: actions/checkout@v4

      # 이 값은 아래에서 SSM 명령 문자열에 들어가 인스턴스에서 root로 실행된다.
      # 자유 문자열을 그대로 실으면 명령 주입이 되므로 커밋 SHA 형식만 받아들인다.
      # 승인 게이트가 사람 판단을 요구하지만 그것은 입력 내용을 검사하지 않는다.
      - name: 배포 대상 커밋 SHA 검증
        run: |
          set -euo pipefail
          case "$IMAGE_TAG" in
            "" | *[!0-9a-f]*)
              echo "커밋 SHA는 소문자 16진수 40자여야 한다: '${IMAGE_TAG}'" >&2
              exit 1
              ;;
          esac
          if [ "${#IMAGE_TAG}" -ne 40 ]; then
            echo "커밋 SHA는 40자여야 한다 (${#IMAGE_TAG}자): '${IMAGE_TAG}'" >&2
            exit 1
          fi
          echo "배포 대상 커밋: $IMAGE_TAG"

      - name: AWS 자격 증명 (OIDC, 장기 키 없음)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::711457211155:role/masiton-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      # 배포 스크립트를 인스턴스로 실어 보낸다. 인스턴스에 미리 설치해 두는 방식은
      # 스크립트를 바꿀 때 수동 단계가 생겨 ADR-RUNTIME-001 12절이 경계한 "재현 절차가
      # 문서 밖 암묵 지식이 되는 것"에 가까워진다. 저장소의 현재 내용을 그대로 보낸다.
      #
      # base64로 싣는 이유는 인용과 개행 처리를 없애기 위한 것이다.
      - name: SSM 명령 준비
        run: |
          set -euo pipefail
          python3 - <<'PY' > command.json
          import base64
          import io
          import json
          import os
          import tarfile

          files = [
              "deploy/scripts/app-deploy.sh",
              "deploy/scripts/app-run.sh",
              "deploy/scripts/app-secrets-render.sh",
              "deploy/scripts/runtime-health.sh",
              "deploy/scripts/instance-bootstrap.sh",
              "deploy/scripts/redis-install.sh",
              "deploy/scripts/redis-render-conf.sh",
              "deploy/redis/redis.conf",
              "deploy/redis/masiton-redis.service",
              "deploy/scripts/nginx-install.sh",
              "deploy/scripts/nginx-smoke.sh",
              "deploy/scripts/tls-deploy-cert.sh",
              "deploy/app/masiton-backend.service",
              "deploy/app/masiton-frontend.service",
              "deploy/nginx/nginx.conf",
              "deploy/nginx/masiton.click.conf",
              "deploy/nginx/00-masiton-upgrade-map.conf",
              "deploy/nginx/masiton-tls-renew.service",
              "deploy/nginx/masiton-tls-renew.timer",
          ]

          archive = io.BytesIO()
          with tarfile.open(fileobj=archive, mode="w:gz", compresslevel=9) as bundle:
              for path in files:
                  with open(path, "rb") as handle:
                      content = handle.read().replace(b"\r\n", b"\n")
                  info = tarfile.TarInfo(os.path.basename(path))
                  info.size = len(content)
                  info.mode = 0o644
                  info.mtime = 0
                  bundle.addfile(info, io.BytesIO(content))

          encoded = base64.b64encode(archive.getvalue()).decode("ascii")
          lines = [
              "set -euo pipefail",
              "STAGE=/tmp/masiton-deploy",
              'rm -rf "$STAGE"',
              'mkdir -p "$STAGE"',
          ]
          for index in range(0, len(encoded), 400):
              redirect = ">" if index == 0 else ">>"
              lines.append(f'printf %s "{encoded[index:index + 400]}" {redirect} "$STAGE/deploy-bundle.tar.gz.b64"')
          lines.append('base64 -d "$STAGE/deploy-bundle.tar.gz.b64" > "$STAGE/deploy-bundle.tar.gz"')
          lines.append('tar -xzf "$STAGE/deploy-bundle.tar.gz" -C "$STAGE"')
          lines.append('rm -f "$STAGE/deploy-bundle.tar.gz.b64" "$STAGE/deploy-bundle.tar.gz"')
          lines.append('chmod +x "$STAGE/app-deploy.sh" "$STAGE/app-run.sh" "$STAGE/app-secrets-render.sh" "$STAGE/nginx-install.sh" "$STAGE/nginx-smoke.sh" "$STAGE/tls-deploy-cert.sh"')
          lines.append('chmod +x "$STAGE/runtime-health.sh" "$STAGE/instance-bootstrap.sh" "$STAGE/redis-install.sh" "$STAGE/redis-render-conf.sh"')
          lines.append(f'"$STAGE/app-deploy.sh" "{os.environ["IMAGE_TAG"]}" "$STAGE"')
          lines.append('"$STAGE/nginx-install.sh" "$STAGE"')

          payload = {"commands": ["\n".join(lines)], "executionTimeout": ["1800"]}
          serialized = json.dumps(payload, ensure_ascii=True)
          max_ssm_command_bytes = 64 * 1024
          payload_bytes = len(serialized.encode("utf-8"))
          if payload_bytes > max_ssm_command_bytes:
              raise SystemExit(
                  f"SSM 명령 JSON이 64KB 제한을 넘었다: {payload_bytes} > {max_ssm_command_bytes}")
          print(serialized)
          PY
          echo "명령 크기: $(wc -c < command.json)바이트"

      # 배포 스크립트가 상태 확인 폴링까지 하고 실패하면 non-zero로 끝난다. 그래서
      # 명령 상태가 Success가 아니면 이 job도 실패한다. 실패를 성공으로 바꾸지 않는다.
      - name: SSM으로 배포 실행
        if: env.DEPLOYMENT_TARGET == 'instance'
        run: |
          set -euo pipefail
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "file://command.json" \
            --query 'Command.CommandId' --output text)
          echo "CommandId: $command_id"

          status=Pending
          for _ in $(seq 1 120); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          {
            echo '## 운영 배포'
            echo
            echo "커밋 \`${IMAGE_TAG}\`"
            echo
            echo '```text'
            aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query 'StandardOutputContent' --output text
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "===== 실행 출력 ====="
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text

          if [ "$status" != "Success" ]; then
            echo "===== 오류 출력 ====="
            aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query 'StandardErrorContent' --output text
            echo "배포가 실패했다 (상태 $status). 직전 이미지로 롤백하려면 Actions에서 이 워크플로를 workflow_dispatch로 실행하고 image_tag에 직전 커밋 SHA를 넣는다. 같은 승인 게이트를 거친다." >&2
            exit 1
          fi
          echo "배포 완료: $IMAGE_TAG"

      - name: CodeDeploy revision 패키징
        if: env.DEPLOYMENT_TARGET == 'codedeploy'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io
          import os
          import tarfile

          files = [
              "deploy/scripts/app-deploy.sh",
              "deploy/scripts/app-run.sh",
              "deploy/scripts/app-secrets-render.sh",
              "deploy/scripts/runtime-health.sh",
              "deploy/scripts/instance-bootstrap.sh",
              "deploy/scripts/redis-install.sh",
              "deploy/scripts/redis-render-conf.sh",
              "deploy/redis/redis.conf",
              "deploy/redis/masiton-redis.service",
              "deploy/scripts/nginx-install.sh",
              "deploy/scripts/nginx-smoke.sh",
              "deploy/scripts/tls-deploy-cert.sh",
              "deploy/app/masiton-backend.service",
              "deploy/app/masiton-frontend.service",
              "deploy/nginx/nginx.conf",
              "deploy/nginx/masiton.click.conf",
              "deploy/nginx/00-masiton-upgrade-map.conf",
              "deploy/nginx/masiton-tls-renew.service",
              "deploy/nginx/masiton-tls-renew.timer",
              # Redis 장애는 ready 그룹에 없어 ALB target health로 드러나지 않는다.
              # 이 지표 수집이 CodeDeploy alarm의 유일한 감지 경로이므로 revision에
              # 실어 새 인스턴스마다 설치한다(ADR-DEPLOY-005 5절).
              "deploy/scripts/cloudwatch-install.sh",
              "deploy/scripts/health-metrics.sh",
              "deploy/cloudwatch/amazon-cloudwatch-agent.json",
              "deploy/cloudwatch/masiton-health-metrics.service",
              "deploy/cloudwatch/masiton-health-metrics.timer",
          ]
          hooks = [
              "deploy/codedeploy/hooks/after-install.sh",
              "deploy/codedeploy/hooks/application-start.sh",
              "deploy/codedeploy/hooks/validate-service.sh",
          ]
          image_tag = os.environ["IMAGE_TAG"]
          if len(image_tag) != 40 or any(char not in "0123456789abcdef" for char in image_tag):
              raise SystemExit("IMAGE_TAG must be a 40-character lowercase commit SHA")

          with tarfile.open("codedeploy-revision.tar.gz", "w:gz", compresslevel=9) as bundle:
              bundle.add("deploy/codedeploy/appspec.yml", arcname="appspec.yml")
              for path in files:
                  content = open(path, "rb").read().replace(b"\r\n", b"\n")
                  info = tarfile.TarInfo("stage/" + os.path.basename(path))
                  info.size = len(content)
                  info.mode = 0o755 if path.endswith(".sh") else 0o644
                  info.mtime = 0
                  bundle.addfile(info, io.BytesIO(content))
              for path in hooks:
                  content = open(path, "rb").read().replace(b"\r\n", b"\n")
                  info = tarfile.TarInfo("stage/codedeploy/hooks/" + os.path.basename(path))
                  info.size = len(content)
                  info.mode = 0o755
                  info.mtime = 0
                  bundle.addfile(info, io.BytesIO(content))
              tag = (image_tag + "\n").encode("ascii")
              info = tarfile.TarInfo("stage/revision.env")
              info.size = len(tag)
              info.mode = 0o600
              info.mtime = 0
              bundle.addfile(info, io.BytesIO(tag))
          PY
          tar -tzf codedeploy-revision.tar.gz | grep -Fx 'appspec.yml'
          tar -tzf codedeploy-revision.tar.gz | grep -Fx 'stage/revision.env'

      - name: CodeDeploy revision 업로드 및 배포
        id: codedeploy_deploy
        if: env.DEPLOYMENT_TARGET == 'codedeploy'
        run: |
          set -euo pipefail
          case "$CODEDEPLOY_S3_BUCKET" in
            ''|*[!a-z0-9.-]*) echo 'CODEDEPLOY_S3_BUCKET은 workflow input 또는 환경 변수로 명시해야 한다' >&2; exit 1 ;;
          esac
          case "$CODEDEPLOY_APPLICATION:$CODEDEPLOY_DEPLOYMENT_GROUP" in
            :*|*:) echo 'CodeDeploy application/deployment-group 입력이 필요하다' >&2; exit 1 ;;
          esac
          revision_key="masiton/codedeploy/${GITHUB_RUN_ID}/${IMAGE_TAG}.tar.gz"
          aws s3 cp codedeploy-revision.tar.gz \
            "s3://${CODEDEPLOY_S3_BUCKET}/${revision_key}" --sse AES256
          revision_version=$(aws s3api head-object \
            --bucket "$CODEDEPLOY_S3_BUCKET" --key "$revision_key" \
            --query 'VersionId' --output text)
          [ -n "$revision_version" ] && [ "$revision_version" != None ] || {
            echo 'revision bucket versioning이 활성화되지 않았다' >&2
            exit 1
          }
          deployment_id=$(aws deploy create-deployment \
            --application-name "$CODEDEPLOY_APPLICATION" \
            --deployment-group-name "$CODEDEPLOY_DEPLOYMENT_GROUP" \
            --s3-location "bucket=${CODEDEPLOY_S3_BUCKET},key=${revision_key},bundleType=tgz,version=${revision_version}" \
            --description "masit-on ${IMAGE_TAG}" \
            --query 'deploymentId' --output text)
          echo "CodeDeploy deployment: $deployment_id"
          deployment_id_file="$RUNNER_TEMP/codedeploy-deployment-id"
          printf '%s\n' "$deployment_id" > "$deployment_id_file"
          # workflow 취소 시 후속 Actions step은 실행되지 않을 수 있으므로,
          # cleanup job이 접근할 수 있는 S3에 deployment ID를 이 step에서 즉시 보관한다.
          deployment_id_key="masiton/codedeploy/${GITHUB_RUN_ID}/deployment-id"
          if ! aws s3api put-object \
            --bucket "$CODEDEPLOY_S3_BUCKET" \
            --key "$deployment_id_key" \
            --body "$deployment_id_file" \
            --server-side-encryption AES256 >/dev/null; then
            echo "::error::CodeDeploy deployment ID 보관에 실패했다: $deployment_id" >&2
            aws deploy stop-deployment --deployment-id "$deployment_id" \
              --auto-rollback-enabled || true
            exit 1
          fi
          deployment_terminal=false
          stopping_deployment=false

          stop_deployment_and_wait() {
            [ "$deployment_terminal" = true ] && return 0
            [ "$stopping_deployment" = true ] && return 0
            stopping_deployment=true
            stop_failed=false
            echo "CodeDeploy 배포 중지를 요청한다: $deployment_id" >&2
            if ! aws deploy stop-deployment --deployment-id "$deployment_id" \
              --auto-rollback-enabled; then
              stop_failed=true
              echo "::error::CodeDeploy stop-deployment 호출에 실패했다: $deployment_id" >&2
            fi
            for _ in $(seq 1 60); do
              status=$(aws deploy get-deployment --deployment-id "$deployment_id" \
                --query 'deploymentInfo.status' --output text 2>/dev/null || echo Unknown)
              case "$status" in
                Succeeded|Failed|Stopped)
                  deployment_terminal=true
                  echo "CodeDeploy 중지 후 terminal 상태: $status" >&2
                  [ "$stop_failed" = false ]
                  return $?
                  ;;
              esac
              sleep 10
            done
            echo "::error::CodeDeploy 중지 요청 후에도 terminal 상태를 확인하지 못했다: $status" >&2
            return 1
          }

          on_exit() {
            exit_code=$?
            if [ "$deployment_terminal" != true ] && [ "$stopping_deployment" != true ]; then
              if ! stop_deployment_and_wait; then
                echo "::error::CodeDeploy 중지 또는 terminal 상태 확인에 실패했다. 원격 deployment를 수동 확인해야 한다." >&2
                [ "$exit_code" -eq 0 ] && exit_code=1
              fi
            fi
            trap - EXIT INT TERM
            exit "$exit_code"
          }
          on_signal() {
            exit 143
          }
          trap on_exit EXIT
          trap on_signal INT TERM

          status=Created
          # AfterInstall hook(30분)와 ASG provisioning 시간을 포함하되, 제한 시간
          # 초과·workflow 취소 시 EXIT trap에서 중지 요청을 보내 제어 공백을 막는다.
          for _ in $(seq 1 270); do
            status=$(aws deploy get-deployment --deployment-id "$deployment_id" \
              --query 'deploymentInfo.status' --output text 2>/dev/null || echo Unknown)
            case "$status" in
              Succeeded|Failed|Stopped)
                deployment_terminal=true
                break
                ;;
            esac
            sleep 10
          done
          if [ "$status" != Succeeded ]; then
            echo "CodeDeploy 배포 실패: $status" >&2
            exit 1
          fi
          echo 'CodeDeploy 배포 완료'

  # GitHub 취소는 현재 step에 SIGINT·SIGTERM을 보내고 곧 프로세스 트리를 종료할
  # 수 있어 deploy job 내부 trap만으로는 원격 CodeDeploy 정리를 보장할 수 없다.
  # 별도 job은 취소된 deploy job이 S3에 남긴 deployment ID를 읽어 4분 이내에 stop과
  # terminal 확인을 수행한다. 5분 취소 강제 종료 한도 안에 끝나도록 polling을 제한한다.
  codedeploy-cancel-cleanup:
    name: 취소된 CodeDeploy 정리
    needs: [deploy]
    if: >-
      always() &&
      needs.deploy.result == 'cancelled' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.deployment_target == 'codedeploy'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      CODEDEPLOY_S3_BUCKET: ${{ github.event.inputs.codedeploy_s3_bucket || '' }}
    steps:
      - name: AWS 자격 증명 (OIDC, 장기 키 없음)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::711457211155:role/masiton-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: CodeDeploy deployment ID 조회
        run: |
          set -euo pipefail
          case "$CODEDEPLOY_S3_BUCKET" in
            ''|*[!a-z0-9.-]*) echo 'CODEDEPLOY_S3_BUCKET은 cleanup에도 필요하다' >&2; exit 1 ;;
          esac
          deployment_id_file="$RUNNER_TEMP/codedeploy-deployment-id"
          deployment_id_key="masiton/codedeploy/${GITHUB_RUN_ID}/deployment-id"
          aws s3 cp "s3://${CODEDEPLOY_S3_BUCKET}/${deployment_id_key}" \
            "$deployment_id_file"

      - name: 원격 CodeDeploy 중지 및 terminal 확인
        if: always()
        run: |
          set -euo pipefail
          deployment_id_file="$RUNNER_TEMP/codedeploy-deployment-id"
          if [ ! -s "$deployment_id_file" ]; then
            echo '::error::취소된 배포의 CodeDeploy deployment ID S3 object를 확인하지 못했다.'
            exit 1
          fi
          deployment_id=$(tr -d '\r\n' < "$deployment_id_file")
          case "$deployment_id" in
            d-*[!0-9A-Za-z-]*|'' )
              echo "::error::deployment ID 형식이 올바르지 않다: $deployment_id"
              exit 1
              ;;
          esac

          stop_failed=false
          if ! aws deploy stop-deployment --deployment-id "$deployment_id" \
            --auto-rollback-enabled; then
            stop_failed=true
            echo "::error::CodeDeploy stop-deployment 호출에 실패했다: $deployment_id"
          fi

          status=Unknown
          for _ in $(seq 1 24); do
            status=$(aws deploy get-deployment --deployment-id "$deployment_id" \
              --query 'deploymentInfo.status' --output text 2>/dev/null || echo Unknown)
            case "$status" in
              Succeeded|Failed|Stopped)
                echo "CodeDeploy cleanup terminal 상태: $status"
                [ "$stop_failed" = false ]
                exit $?
                ;;
            esac
            sleep 10
          done
          echo "::error::CodeDeploy cleanup이 terminal 상태를 확인하지 못했다: $status"
          exit 1

