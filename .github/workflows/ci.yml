# ADR-CI-001 빌드·테스트 품질 게이트.
# 모든 PR과 통합 브랜치 push에서 고정 런타임으로 빌드·자동 테스트를 실행하고
# 실패한 변경을 차단한다.
#
# 이미지 빌드·검증·ECR push와 운영 배포는 M2부터 활성화하는 범위다(ADR-DEPLOY-002,
# ADR-CI-001). 같은 워크플로에 두는 이유는 아래 images·ssm-deploy job 주석에 있다.
# images·ssm-deploy는 배포 대상 브랜치에서만 돌고 PR과 develop push에서는 실행되지 않으며,
# workflow_dispatch의 배포 대상은 별도의 프론트엔드 프로덕션 의존성 감사 job을 거친다.
# 운영 배포 경로는 단일 EC2 SSM Run Command다.
name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - 'deploy/**'
  # 배포 대상 커밋을 직접 지정하는 입력 경로다. push 트리거만으로는 배포 job이 항상
  # 현재 실행의 커밋을 배포하게 되어, 장애 시 직전 digest로 되돌리려면 승인 게이트
  # 밖에서 배포를 수동 실행해야 한다. 롤백도 같은 경로를 쓰도록 하는 #78 완료 조건이다.
  #
  # 이 경로도 배포 job의 `environment: production` 승인을 그대로 거친다. 승인 없이는
  # job이 시작되지 않으므로 게이트를 우회하는 경로가 아니다.
  workflow_dispatch:
    inputs:
      image_tag:
        description: '배포할 커밋 SHA 40자. 비우면 선택한 브랜치의 현재 커밋을 배포한다'
        required: false
        type: string
      instance_id:
        description: '배포할 앱 EC2 instance_id. 비우면 저장소 변수 PRODUCTION_INSTANCE_ID를 쓴다'
        required: false
        type: string
      deployment_target:
        description: '배포 경로: 단일 EC2 SSM Run Command'
        required: false
        default: ssm
        type: choice
        options:
          - ssm

permissions:
  contents: read

# PR 검증은 같은 ref의 새 커밋이 오면 이전 실행을 취소한다. 운영 배포는 외부
# 취소나 새 실행이 원격 배포 명령을 방치할 수 있어 자동 취소하지 않는다.
#
# 운영 push와 workflow_dispatch는 같은 production 그룹으로 직렬화해 SSM 배포가
# 겹치지 않게 한다. PR은 별도 그룹에서 기존처럼 새 실행이 우선한다.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || ((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/deploy/')) && 'ci-production-deploy' || format('ci-ci-{0}', github.ref)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tracked-secrets:
    name: 추적 파일 RSA 개인키 검사
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: secret scan 회귀 테스트
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File ./scripts/check-tracked-secrets.Tests.ps1

      - name: 최종 tracked tree secret scan
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File ./scripts/check-tracked-secrets.ps1 -RepositoryRoot "$env:GITHUB_WORKSPACE"

  terraform-contract:
    name: Terraform 렌더링 계약
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Redis user-data는 Terraform templatefile()과 Bash가 함께 해석한다.
      # 고정된 Terraform 버전으로 실제 렌더링 결과를 검사해 plan 단계의 보간
      # 회귀를 PR 품질 게이트에서 차단한다.
      - name: Redis template 렌더링 테스트
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/infra/production/terraform-redis/tests/template-render \
            hashicorp/terraform@sha256:9a42ea97ea25b363f4c65be25b9ca52b1e511ea5bf7d56050a506ad2daa7af9d test

      - name: Production Terraform backend 없이 초기화·검증
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/infra/production/terraform \
            --entrypoint sh \
            hashicorp/terraform@sha256:9a42ea97ea25b363f4c65be25b9ca52b1e511ea5bf7d56050a506ad2daa7af9d \
            -c 'terraform init -backend=false && terraform validate'

  # workflow_dispatch는 이미 게시된 이미지를 배포하는 경로다. backend·frontend job은
  # 실행 커밋의 현재 소스를 검사하므로 이 경로에서 건너뛰고, 아래 dispatch audit job이
  # 실제 배포 대상 image_tag의 프론트엔드 package-lock.json을 검사한다. 롤백·재배포가
  # 오래된 이미지의 취약한 의존성을 다시 배포하는 우회 경로가 되지 않게 하는 별도 게이트다.
  backend:
    name: 백엔드 빌드·테스트
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 공유 Redis endpoint 셸 계약
        run: ./deploy/scripts/tests/redis-endpoint-contract-test.sh

      - name: Redis S3 비밀값 렌더링 셸 계약
        run: ./deploy/scripts/tests/redis-render-conf-s3-test.sh

      # ADR-CI-001 9·10절과 기술 정책 3절이 CI 런타임을 JDK 21.0.12로 고정한다.
      # `21`처럼 major만 주면 setup-java가 최신 21.x를 고를 수 있어 저장소 변경 없이
      # CI 런타임이 달라진다. 패치까지 명시한다.
      # Gradle은 Wrapper만 사용하며 시스템 Gradle로 우회하지 않는다(CLAUDE.md 5절).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: gradle

      # 통합 테스트는 Testcontainers로 PostgreSQL·Redis를 실행 시점에 띄운다.
      # ubuntu 러너에는 Docker가 이미 있어 추가 서비스 컨테이너가 필요하지 않다.
      - name: 빌드와 자동화 테스트
        run: ./gradlew --no-daemon clean build

      # 실패 원인을 PR에서 바로 확인할 수 있어야 게이트가 쓸모 있다.
      - name: 테스트 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 14

  frontend:
    name: 프론트엔드 빌드·타입 검사
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # ADR-CI-001 9·10절이 고정 런타임(Node 24.18.0)에서 프론트엔드 빌드를 요구한다.
      #
      # setup-node로 러너에 Node를 깔고 `npm run build`를 돌리면 `next build`가
      # 정적 페이지 생성 단계에서 오류 메시지 없이 exit 1로 죽는다. 같은 명령이 아래
      # 컨테이너에서는 통과한다. 두 환경의 차이는 npm이다. setup-node는 Node 버전만
      # 고정하고 npm은 러너 이미지가 정하므로 저장소가 고정한 값이 아니다. 실제로
      # 러너와 컨테이너의 npm 경고 문구가 달랐다. 즉 이 조합은 고정 런타임이 아니다.
      #
      # `next build`가 오류를 남기지 않아 실패의 근본 원인은 격리하지 못했다.
      # 원인을 모른 채 러너에 우회를 넣는 대신, ADR이 고정한 Node와 그에 번들된 npm을
      # digest까지 못박아 그 안에서 빌드한다. 로컬 컨테이너 실행, CI, 운영 이미지가
      # 모두 같은 Node 24.18.0 + npm 11.16.0을 쓴다.
      #
      # digest를 바꿀 때는 태그도 함께 바꾼다. 한쪽만 바꾸면 빌드가 실패하거나
      # 의도와 다른 이미지를 쓴다.
      #
      # `npm audit`는 package-lock.json에 고정된 프로덕션 의존성만 검사하고 high 이상을
      # 발견하면 0이 아닌 코드로 끝난다. 감사와 빌드를 같은 고정 런타임의 단일 명령
      # 체인으로 실행해 취약한 산출물이 다음 단계로 넘어가지 않게 한다.
      # `npm run build`는 `tsc --noEmit && next build`라 타입 검사와 프로덕션 빌드를
      # 한 번에 수행한다. next.config.ts가 Next 내장 TypeScript 단계를 끄고 있어
      # 타입 검사는 이 tsc가 담당한다.
      - name: 프로덕션 의존성 감사·타입 검사와 프로덕션 빌드 (고정 런타임)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/frontend":/app \
            -w /app \
            node:24.18.0-alpine@sha256:a0b9bf06e4e6193cf7a0f58816cc935ff8c2a908f81e6f1a95432d679c54fbfd \
            sh -c 'npm ci && npm audit --omit=dev --audit-level=high && npm run build'

  # workflow_dispatch에서만 실행한다. dispatch의 image_tag는 현재 워크플로 소스와
  # 다를 수 있으므로, 반드시 배포 job과 같은 대상(image_tag 또는 github.sha)을
  # 검증·checkout한 뒤 고정 Node 런타임으로 package-lock.json을 감사한다.
  frontend-dispatch-audit:
    name: dispatch 프론트엔드 프로덕션 의존성 감사
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: 배포 대상 커밋 SHA 검증
        id: target
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}
        run: |
          set -euo pipefail
          case "$IMAGE_TAG" in
            "" | *[!0-9a-f]*)
              echo "커밋 SHA는 소문자 16진수 40자여야 한다: '${IMAGE_TAG}'" >&2
              exit 1
              ;;
          esac
          if [ "${#IMAGE_TAG}" -ne 40 ]; then
            echo "커밋 SHA는 40자여야 한다 (${#IMAGE_TAG}자): '${IMAGE_TAG}'" >&2
            exit 1
          fi
          printf 'image_tag=%s\n' "$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.target.outputs.image_tag }}

      - name: 프로덕션 의존성 감사 (고정 런타임)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/frontend":/app \
            -w /app \
            node:24.18.0-alpine@sha256:a0b9bf06e4e6193cf7a0f58816cc935ff8c2a908f81e6f1a95432d679c54fbfd \
            sh -c 'npm ci && npm audit --omit=dev --audit-level=high'

  images:
    name: 이미지 빌드·검증·push
    # 빌드·테스트가 하나라도 실패하면 이 job에 도달하지 않는다.
    # ADR-RUNTIME-001 13절과 M2-06 완료 조건이 요구하는 차단이다.
    needs: [backend, frontend, terraform-contract, tracked-secrets]
    #
    # 배포 대상 브랜치의 push에서만 실행한다. 세 가지를 동시에 만족시키기 위한 조건이다.
    #
    #   1. OIDC 신뢰 정책 일치. IAM 역할은 refs/heads/main과 refs/heads/deploy/m2만
    #      허용한다. push 이벤트의 OIDC `sub`가 실제 push된 ref이므로 일치한다.
    #      workflow_run으로 분리했을 때는 `sub`가 기본 브랜치(develop)가 되어
    #      AssumeRoleWithWebIdentity가 거절됐다.
    #   2. 권한 상승 차단. workflow_run은 권한 있는 컨텍스트라 fork PR의 head SHA를
    #      체크아웃한 상태로 OIDC를 주면 외부 코드가 우리 ECR에 push할 수 있다.
    #      push 이벤트는 저장소 내부 브랜치에서만 발생해 그 경로가 없다.
    #   3. ADR-CI-001 9절의 "이미지 생성·push는 M2부터" 범위. develop push와 PR에서는
    #      이 job이 실행되지 않는다.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/deploy/m2')
    # 운영 EC2가 arm64(t4g.medium)이므로 같은 아키텍처에서 빌드한다.
    # 공개 저장소는 arm64 러너를 무료로 쓸 수 있어 QEMU 에뮬레이션이 필요 없다.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      ECR_REGISTRY: 711457211155.dkr.ecr.ap-northeast-2.amazonaws.com
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # ADR-RUNTIME-001 13절: 베이스 이미지가 명시 태그(운영은 digest)를 쓰는지 대조한다.
      # digest 없이 태그만 쓴 FROM이 하나라도 있으면 실패시킨다.
      - name: 베이스 이미지 digest 고정 검사
        run: |
          set -euo pipefail
          status=0
          for dockerfile in Dockerfile frontend/Dockerfile; do
            while read -r line; do
              case "$line" in
                *@sha256:*) ;;
                *) echo "digest 미고정: $dockerfile -> $line"; status=1 ;;
              esac
            done < <(grep -E '^FROM ' "$dockerfile")
          done
          if [ "$status" -ne 0 ]; then
            echo '베이스 이미지는 태그와 digest를 함께 고정해야 한다.'
            exit 1
          fi
          echo 'FROM 전부 digest 고정 확인'

      - name: 백엔드 이미지 빌드
        run: docker build -t "masiton-backend:${IMAGE_TAG}" -f Dockerfile .

      # ADR-LANG-001 13절: 이미지의 `java -version`이 정확히 21.0.12인지 대조한다.
      # 베이스 이미지를 갱신하다 다른 패치로 넘어가면 여기서 막는다.
      - name: 런타임 JDK 패치 버전 대조
        run: |
          set -euo pipefail
          expected='21.0.12'
          # `| head -1`을 쓰면 head가 첫 줄을 읽고 종료하면서 java에 SIGPIPE가 가고,
          # pipefail이 그 141을 파이프라인 상태로 잡아 step이 실패한다.
          # 출력을 변수에 담은 뒤 첫 줄을 꺼내면 파이프가 없어 이 문제가 없다.
          version_output=$(docker run --rm --entrypoint java "masiton-backend:${IMAGE_TAG}" -version 2>&1)
          actual=${version_output%%$'\n'*}
          echo "이미지 java -version: ${actual}"
          case "$actual" in
            *"\"${expected}\""*) echo "JDK ${expected} 확인" ;;
            *) echo "ADR-LANG-001이 요구하는 ${expected}가 아니다"; exit 1 ;;
          esac

      # Kakao Maps JavaScript 키는 빌드 시점에 클라이언트 번들로 들어간다. 런타임
      # 환경 변수로는 바뀌지 않으므로 여기서 넘기지 않으면 지도가 항상 오류 상태로
      # 배포된다. 값이 비면 빌드를 멈춘다. 조용히 통과하면 배포는 성공으로 끝나고
      # 지도만 죽은 이미지가 나간다.
      #
      # Secret이 아니라 변수를 쓴다. ADR-MAP-001 6.5가 이 키를 브라우저 노출
      # 식별자로 분류하고 허용 도메인 제한을 보호 수단으로 삼는다. Secret으로 두면
      # 로그 마스킹이 붙어 값이 맞는지 확인할 수단만 사라진다.
      # SEO 사이트 URL과 GA4 측정 ID도 브라우저에 노출되는 공개값이므로 Secret이 아닌
      # 저장소 변수로 전달한다. 운영 SEO를 위해 사이트 URL은 canonical과 정확히 일치해야 한다.
      - name: 프론트엔드 이미지 빌드
        env:
          KAKAO_MAPS_JS_KEY: ${{ vars.NEXT_PUBLIC_KAKAO_MAPS_JS_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${KAKAO_MAPS_JS_KEY}" ]; then
            echo '저장소 변수 NEXT_PUBLIC_KAKAO_MAPS_JS_KEY가 비어 있다.'
            echo '이 값 없이 빌드하면 지도 화면이 SDK 오류 상태로 배포된다.'
            exit 1
          fi
          if [ "${NEXT_PUBLIC_SITE_URL}" != 'https://masiton.click' ]; then
            echo '저장소 변수 NEXT_PUBLIC_SITE_URL은 canonical https://masiton.click 이어야 한다.'
            exit 1
          fi
          docker build \
            --build-arg "NEXT_PUBLIC_KAKAO_MAPS_JS_KEY=${KAKAO_MAPS_JS_KEY}" \
            --build-arg "NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}" \
            --build-arg "NEXT_PUBLIC_GA_MEASUREMENT_ID=${NEXT_PUBLIC_GA_MEASUREMENT_ID}" \
            -t "masiton-frontend:${IMAGE_TAG}" -f frontend/Dockerfile frontend

      # ADR-RUNTIME-001 13절: 이미지에 평문 비밀값이나 .env가 포함되지 않았는지 검사한다.
      # 하나라도 걸리면 push에 도달하지 않는다.
      # 검사 결과를 파이프로 넘기지 않고 변수에 담아 판정한다.
      # `docker run ... | grep -q .`는 grep이 첫 매치에서 종료하며 docker에 SIGPIPE를
      # 보내고, pipefail이 그 141을 파이프라인 상태로 잡는다. 그러면 `if`가 거짓으로
      # 판정해 **실제로 비밀값을 찾았는데도 통과**하게 된다. 검사가 조용히 무력화되는
      # 방향의 실패라 파이프를 쓰지 않는다.
      - name: 이미지 비밀값·실행 사용자 검증
        run: |
          set -euo pipefail
          for image in "masiton-backend:${IMAGE_TAG}" "masiton-frontend:${IMAGE_TAG}"; do
            echo "=== $image ==="

            # 검사는 --user 0:0으로 실행한다. 이미지의 기본 사용자(uid 1001)로 `find /`를
            # 돌리면 읽을 수 없는 경로에서 오류가 나 결과가 0건이어도 exit 1이 된다.
            # 2>/dev/null은 메시지만 숨기고 종료 코드를 바꾸지 않는다.
            #
            # root로 돌리면 권한 오류가 사라져 종료 코드를 신뢰할 수 있고, 기본 사용자가
            # 읽지 못하는 경로까지 검사 범위에 들어온다. 검사 전용 실행이며 이미지의
            # USER 지시자는 그대로다(아래 비루트 실행 확인이 그것을 검증한다).
            #
            # root 실행으로 권한 오류가 없어졌으므로 결과가 0건이면 find가 exit 0이다.
            # 그래서 `|| true`가 필요하지 않다. 붙이면 docker나 sh 실패까지 성공으로 바꿔
            # 검사가 수행되지 않았는데도 통과한다.
            env_hits=$(docker run --rm --user 0:0 --entrypoint sh "$image" -c \
              "find / -xdev -name '.env' -o -xdev -name '.env.*'")
            if [ -n "$env_hits" ]; then
              echo '.env 파일이 이미지에 포함됐다'
              printf '%s\n' "$env_hits"
              exit 1
            fi
            echo '.env 미포함 확인'

            # 검사를 컨테이너 안에서 grep으로 하지 않는다. `grep -rIl`의 `-I`가 바이너리를
            # 건너뛰므로 백엔드 이미지의 /app에 application.jar 하나만 있는 구성에서는
            # JAR 리소스에 개인키가 들어가도 통과한다. 그래서 /app을 러너로 꺼내
            # JAR까지 풀어 검사한다.
            #
            # BOOT-INF/lib은 검사에서 뺀다. 서드파티 라이브러리가 시험용 키 파일을
            # 담고 있어 오탐을 만든다. 우리가 막아야 하는 것은 우리 소스·리소스가
            # 비밀값을 싣고 나가는 경우이므로 BOOT-INF/classes와 그 밖의 항목을 본다.
            work=$(mktemp -d)
            # extracted를 미리 만든다. 프론트엔드 이미지에는 JAR이 없어 이 디렉터리가
            # 생기지 않고, 존재하지 않는 경로를 받은 grep은 exit 2를 반환해 아래 가드가
            # 검사 실행 실패로 판정한다.
            mkdir -p "$work/extracted"
            cid=$(docker create "$image")
            docker cp "$cid:/app" "$work/app"
            docker rm "$cid" >/dev/null

            for jar in $(find "$work/app" -name '*.jar' -type f); do
              extract="$work/extracted/$(basename "$jar")"
              mkdir -p "$extract"
              # BOOT-INF/lib을 제외하고 푼다. unzip은 일치 항목이 없으면 exit 11이므로
              # 그 경우만 정상으로 처리한다.
              set +e
              unzip -q -o "$jar" -x 'BOOT-INF/lib/*' -d "$extract"
              unzip_status=$?
              set -e
              if [ "$unzip_status" -gt 1 ] && [ "$unzip_status" -ne 11 ]; then
                echo "JAR 해제가 실패했다 ($jar, exit ${unzip_status}). 미검출로 처리하지 않는다."
                exit 1
              fi
              echo "  JAR 해제: $(basename "$jar") -> $(find "$extract" -type f | wc -l)개 파일"
            done

            # --binary-files=text로 바이너리도 내용을 검사한다. 미검출은 exit 1이고
            # 오류는 2 이상이므로 1만 정상으로 처리한다.
            #
            # 패턴은 값 자체를 식별할 수 있고 오탐이 없는 것만 쓴다.
            #
            # 환경 변수 이름(`JWT_PRIVATE_KEY_PEM`)이나 로컬 기본값(`masiton_local`)을
            # 패턴에 넣으면 항상 걸린다. 이미지에는 `${JWT_PRIVATE_KEY_PEM:}` 플레이스홀더가
            # 담긴 application.yml과 로컬 기본값을 담은 application-local.yml이 정상적으로
            # 들어 있다. 둘 다 저장소에 공개된 값이고 운영은 prod 프로파일을 쓴다.
            # JAR 내부까지 보게 되면서 드러난 오탐이라 패턴을 좁혔다.
            #
            # 남긴 세 패턴은 그 자체로 유출을 뜻한다. 개인키 PEM 블록, AWS 장기 액세스
            # 키(ADR-SEC-001이 발급을 금지한다), Slack Webhook URL이다.
            set +e
            secret_hits=$(grep -rlE --binary-files=text \
              -e '-----BEGIN( RSA| EC| OPENSSH| DSA)? PRIVATE KEY-----' \
              -e 'AKIA[0-9A-Z]{16}' \
              -e 'hooks\.slack\.com/services/' \
              --exclude='*.jar' "$work/app" "$work/extracted" 2>/dev/null)
            grep_status=$?
            set -e
            if [ "$grep_status" -gt 1 ]; then
              echo "비밀값 검사 실행이 실패했다 (exit ${grep_status}). 미검출로 처리하지 않는다."
              exit 1
            fi
            if [ -n "$secret_hits" ]; then
              echo '평문 비밀값 패턴이 이미지에 포함됐다'
              printf '%s\n' "$secret_hits"
              exit 1
            fi
            echo "평문 비밀값 패턴 미포함 확인 (검사 파일 $(find "$work/app" "$work/extracted" -type f 2>/dev/null | wc -l)개)"
            rm -rf "$work"

            uid=$(docker run --rm --entrypoint id "$image" -u)
            if [ "$uid" = "0" ]; then
              echo "root로 실행된다 (uid=$uid)"
              exit 1
            fi
            echo "비루트 실행 확인 (uid=$uid)"
          done

      # ADR-RUNTIME-001 13절 취약점 검사.
      #
      # ECR의 scan-on-push는 이 단계를 대신할 수 없다. 이름 그대로 push된 뒤에
      # 시작하므로 취약한 이미지가 이미 게시된 상태가 된다. 완료 조건이 "실패하면
      # push와 배포가 차단된다"이므로 게시 전에 판정해야 한다.
      #
      # --ignore-unfixed로 수정 버전이 없는 CVE는 제외한다. 베이스 이미지의 미수정
      # CVE까지 차단하면 우리가 조치할 수 없는 이유로 배포가 멈추고, 결국 기준을
      # 낮추게 되어 게이트가 무력화된다. 조치 가능한 것만 막는다.
      #
      # Trivy 버전은 태그와 digest로 고정한다. 기술 정책 3절이 `latest`를 금지한다.
      - name: 취약점 검사
        run: |
          set -euo pipefail
          for image in "masiton-backend:${IMAGE_TAG}" "masiton-frontend:${IMAGE_TAG}"; do
            echo "=== $image ==="
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v trivy-db:/root/.cache/trivy \
              aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
              image \
                --scanners vuln \
                --severity CRITICAL,HIGH \
                --ignore-unfixed \
                --exit-code 1 \
                "$image"
          done
          echo '수정 가능한 CRITICAL·HIGH 취약점 없음'

      # 여기까지가 자격 증명 없이 수행하는 검증이다.
      # 브랜치 제한은 job 수준 `if`가 이미 처리하므로 step마다 반복하지 않는다.
      # 조건을 두 곳에 두면 한쪽만 고쳐 어긋날 수 있다.
      # IAM 역할 신뢰 정책은 GitHub의 immutable subject claim 형식을 기대한다.
      #
      #   repo:team-youngkk@307880221/masit-on@1308471593:ref:refs/heads/deploy/m2
      #
      # 조직·저장소 숫자 ID가 sub에 포함된다. 이름 기반 형식(`repo:owner/repo:ref:...`)으로
      # 정책을 쓰면 AssumeRoleWithWebIdentity가 거절된다. 저장소를 옮기거나 이름을 바꿀
      # 때는 ID가 유지되므로 정책을 고치지 않아도 되고, 이름 재사용 공격에도 안전하다.
      - name: AWS 자격 증명 (OIDC, 장기 키 없음)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::711457211155:role/masiton-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      # 태그는 커밋 SHA를 쓴다. `latest`는 기술 정책 3절이 금지한다.
      # 리포지토리가 IMMUTABLE이라 같은 SHA를 다시 push할 수 없다.
      - name: 이미지 push와 digest 기록
        run: |
          set -euo pipefail
          {
            echo '## 게시된 이미지'
            echo
            echo "커밋 \`${IMAGE_TAG}\`"
            echo
            echo '| 리포지토리 | 태그 | digest | 상태 |'
            echo '|---|---|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"

          # 리포지토리가 IMMUTABLE이라 이미 있는 태그에 push하면 실패한다.
          # 두 이미지를 순차로 올리는 도중 뒤쪽이 실패하면 재실행 시 앞쪽에서 즉시 막혀
          # 뒤쪽을 영구히 복구할 수 없다. 그래서 각 리포지토리를 독립적으로 멱등하게 처리한다.
          #
          # 태그가 커밋 SHA이므로 "이미 있는 태그"는 같은 소스에서 만든 이미지가 이미
          # 게시됐다는 뜻이다. 그때는 push를 건너뛰고 기존 digest를 그대로 기록한다.
          for name in backend frontend; do
            repo="masiton-${name}"
            remote_tag="${ECR_REGISTRY}/${repo}:${IMAGE_TAG}"

            existing=$(aws ecr describe-images \
              --repository-name "$repo" \
              --image-ids "imageTag=${IMAGE_TAG}" \
              --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)

            if [ -n "$existing" ] && [ "$existing" != "None" ]; then
              echo "${repo}: 태그 ${IMAGE_TAG}가 이미 있다. push를 건너뛴다 (${existing})"
              digest="$existing"
              state='이미 게시됨'
            else
              docker tag "${repo}:${IMAGE_TAG}" "$remote_tag"
              docker push "$remote_tag"
              digest=$(aws ecr describe-images \
                --repository-name "$repo" \
                --image-ids "imageTag=${IMAGE_TAG}" \
                --query 'imageDetails[0].imageDigest' --output text)
              echo "${repo}: push 완료 (${digest})"
              state='새로 게시'
            fi

            echo "| ${repo} | \`${IMAGE_TAG}\` | \`${digest}\` | ${state} |" >> "$GITHUB_STEP_SUMMARY"
          done

  # 단일 EC2 운영 배포 — SSM Run Command로 직접 앱 EC2에 전달한다.
  # push와 workflow_dispatch 모두 production 승인을 거친다.
  ssm-deploy:
    name: 직접 EC2 SSM 배포
    needs: [images, frontend-dispatch-audit]
    if: >-
      always() &&
      !cancelled() &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/deploy/m2') &&
      (
        (github.event_name == 'push' &&
          needs.images.result == 'success' &&
          needs['frontend-dispatch-audit'].result == 'skipped') ||
        (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.deployment_target == 'ssm' &&
          needs.images.result == 'skipped' &&
          needs['frontend-dispatch-audit'].result == 'success')
      )
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      # workflow_dispatch 입력이 없으면 저장소 변수에서 배포 대상을 읽고, 아래 단계에서
      # 비어 있거나 EC2 instance ID 형식이 아니면 즉시 실패한다.
      INSTANCE_ID: ${{ github.event.inputs.instance_id || vars.PRODUCTION_INSTANCE_ID }}
      CONFIGURED_INSTANCE_ID: ${{ vars.PRODUCTION_INSTANCE_ID }}
      # 입력이 있으면 그 커밋을, 없으면 이 실행의 커밋을 배포한다. push 이벤트에는
      # inputs가 없어 항상 github.sha가 된다.
      IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}
      SSM_POINTER_BUCKET: ${{ vars.SSM_COMMAND_POINTER_BUCKET || 'masiton-prod-codedeploy-711457211155' }}
      SSM_POINTER_KEY: masiton/ssm/${{ github.run_id }}/command-id
    steps:
      # 배포할 이미지와 같은 커밋을 체크아웃한다. 롤백 실행에서 과거 이미지에 현재
      # 브랜치 tip의 배포 스크립트가 조합되지 않도록 한다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      # 이 값은 SSM 명령 문자열에 들어가 인스턴스에서 root로 실행된다.
      # 자유 문자열을 그대로 실으면 명령 주입이 되므로 커밋 SHA 형식만 받아들인다.
      # 승인 게이트가 사람 판단을 요구하지만 그것은 입력 내용을 검사하지 않는다.
      - name: 배포 대상 커밋 SHA 검증
        run: |
          set -euo pipefail
          case "$IMAGE_TAG" in
            "" | *[!0-9a-f]*)
              echo "커밋 SHA는 소문자 16진수 40자여야 한다: '$IMAGE_TAG'" >&2
              exit 1
              ;;
          esac
          if [ "${#IMAGE_TAG}" -ne 40 ]; then
            echo "커밋 SHA는 40자여야 한다 (match: ${#IMAGE_TAG}자): '$IMAGE_TAG'" >&2
            exit 1
          fi
          echo "배포 대상 커밋: $IMAGE_TAG"

      - name: 배포 대상 EC2 instance_id 검증
        run: |
          set -euo pipefail
          if [ -z "$CONFIGURED_INSTANCE_ID" ]; then
            echo '저장소 변수 PRODUCTION_INSTANCE_ID가 비어 있다. Terraform app_instance_id를 등록해야 한다.' >&2
            exit 1
          fi
          if [ -z "$INSTANCE_ID" ]; then
            echo '배포 대상 instance_id가 비어 있다. 저장소 변수 PRODUCTION_INSTANCE_ID 또는 workflow_dispatch 입력이 필요하다.' >&2
            exit 1
          fi
          if [[ ! "$INSTANCE_ID" =~ ^i-[0-9a-f]{17}$ ]]; then
            echo "배포 대상 instance_id 형식이 올바르지 않다: '$INSTANCE_ID'" >&2
            exit 1
          fi
          if [ "$INSTANCE_ID" != "$CONFIGURED_INSTANCE_ID" ]; then
            echo "배포 대상 instance_id가 저장소 변수 PRODUCTION_INSTANCE_ID와 다르다: '$INSTANCE_ID' != '$CONFIGURED_INSTANCE_ID'" >&2
            exit 1
          fi
          echo "배포 대상 EC2: $INSTANCE_ID"

      - name: AWS 자격 증명 (OIDC, 장기 키 없음)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::711457211155:role/masiton-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      # 배포 스크립트를 인스턴스로 실어 보낸다. 인스턴스에 미리 설치해 두는 방식은
      # 스크립트를 바꿀 때 수동 단계가 생긴다. 현재 checkout한 커밋의 내용만 보내므로
      # 이미지와 배포 스크립트의 버전이 어긋나지 않는다. base64로 싣는 이유는 인용과
      # 개행 처리를 없애기 위한 것이다.
      - name: SSM 명령 준비
        run: |
          set -euo pipefail
          python3 - <<'PY' > command.json
          import base64
          import io
          import json
          import os
          import tarfile

          files = [
              "deploy/scripts/app-deploy.sh",
              "deploy/scripts/app-run.sh",
              "deploy/scripts/app-secrets-render.sh",
              "deploy/scripts/runtime-health.sh",
              "deploy/scripts/cloudwatch-install.sh",
              "deploy/scripts/health-metrics.sh",
              "deploy/cloudwatch/amazon-cloudwatch-agent.json",
              "deploy/cloudwatch/masiton-health-metrics.service",
              "deploy/cloudwatch/masiton-health-metrics.timer",
              "deploy/scripts/nginx-install.sh",
              "deploy/scripts/nginx-smoke.sh",
              "deploy/scripts/tls-deploy-cert.sh",
              "deploy/app/masiton-backend.service",
              "deploy/app/masiton-frontend.service",
              "deploy/nginx/nginx.conf",
              "deploy/nginx/masiton.click.conf",
              "deploy/nginx/00-masiton-upgrade-map.conf",
              "deploy/nginx/masiton-tls-renew.service",
              "deploy/nginx/masiton-tls-renew.timer",
          ]

          image_tag = os.environ["IMAGE_TAG"]
          if len(image_tag) != 40 or any(char not in "0123456789abcdef" for char in image_tag):
              raise SystemExit("IMAGE_TAG must be a 40-character lowercase commit SHA")

          lines = [
              "set -euo pipefail",
              "[ \"$(id -u)\" -eq 0 ] || { echo 'SSM 명령은 root로 실행돼야 한다' >&2; exit 1; }",
              "install -d -m 0750 /run/masiton",
              "exec 9>/run/masiton/deploy.lock",
              'flock -n 9 || { echo \'이미 다른 배포가 실행 중이다\' >&2; exit 1; }',
              "STAGE=/tmp/masiton-deploy",
              'rm -rf "$STAGE"',
              'umask 077',
              'mkdir -p "$STAGE"',
          ]
          bundle = io.BytesIO()
          with tarfile.open(fileobj=bundle, mode="w:gz", compresslevel=9) as archive:
              for path in files:
                  with open(path, "rb") as handle:
                      content = handle.read().replace(b"\r\n", b"\n")
                  info = tarfile.TarInfo(os.path.basename(path))
                  info.size = len(content)
                  info.mode = 0o755 if path.endswith(".sh") else 0o644
                  info.mtime = 0
                  archive.addfile(info, io.BytesIO(content))
          encoded = base64.b64encode(bundle.getvalue()).decode("ascii")
          for index in range(0, len(encoded), 400):
              redirect = ">" if index == 0 else ">>"
              lines.append(f'printf %s "{encoded[index:index + 400]}" {redirect} "$STAGE/payload.tgz.b64"')
          lines.append('base64 -d "$STAGE/payload.tgz.b64" > "$STAGE/payload.tgz"')
          lines.append('rm -f "$STAGE/payload.tgz.b64"')
          lines.append('tar -xzf "$STAGE/payload.tgz" -C "$STAGE"')
          lines.append('rm -f "$STAGE/payload.tgz"')
          lines.append('for script in app-deploy.sh app-run.sh app-secrets-render.sh runtime-health.sh cloudwatch-install.sh health-metrics.sh nginx-install.sh nginx-smoke.sh tls-deploy-cert.sh; do chmod +x "$STAGE/$script"; done')
          lines.extend([
              'install -d -m 0750 /etc/masiton',
              'for setting in METRIC_ENVIRONMENT=production REQUIRE_SHARED_REDIS=true NGINX_TRUSTED_PROXY_CIDRS=127.0.0.1; do key=${setting%%=*}; if [ -f /etc/masiton/deployment.env ] && grep -q "^${key}=" /etc/masiton/deployment.env; then sed -i "s|^${key}=.*|${setting}|" /etc/masiton/deployment.env; else printf "%s\\n" "$setting" >> /etc/masiton/deployment.env; fi; done; chmod 0640 /etc/masiton/deployment.env',
          ])
          lines.append(f'"$STAGE/app-deploy.sh" "{image_tag}" "$STAGE"')
          lines.append('"$STAGE/cloudwatch-install.sh" "$STAGE"')

          command = "\n".join(lines)
          max_bytes = 65536  # AWS-RunShellScript command limit: 64 KiB.
          command_size = len(command.encode("utf-8"))
          if command_size > max_bytes:
              raise SystemExit(f"SSM commands가 64KB 제한을 초과했다: {command_size}바이트")
          payload = {"commands": [command], "executionTimeout": ["1800"]}
          payload_json = json.dumps(payload, ensure_ascii=True, separators=(",", ":"))
          payload_size = len(payload_json.encode("utf-8"))
          if payload_size > max_bytes:
              raise SystemExit(f"SSM command payload가 64KB 제한을 초과했다: {payload_size}바이트")
          print(payload_json)
          PY
          command_size=$(python3 -c 'import json,sys; print(len(json.load(sys.stdin)["commands"][0].encode("utf-8")))' < command.json)
          payload_size=$(wc -c < command.json)
          echo "SSM 명령 크기: $command_size바이트, payload: $payload_size바이트 (제한 65536바이트)"

      # 배포 스크립트가 상태 확인까지 하고 실패하면 non-zero로 끝난다. 그래서
      # SSM 명령 상태가 Success가 아니면 이 job도 실패한다. 실패를 성공으로 바꾸지 않는다.
      # CommandId를 만든 직후 S3 pointer에 저장한다. runner가 취소·종료돼도
      # 별도 cleanup job이 원격 명령을 찾아 취소할 수 있어야 한다.
      - name: SSM으로 배포 실행
        run: |
          set -euo pipefail
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "file://command.json" \
            --query 'Command.CommandId' --output text)
          if [ -z "$command_id" ] || [ "$command_id" = "None" ]; then
            echo 'SSM CommandId를 받지 못했다' >&2
            exit 1
          fi
          echo "CommandId: $command_id"
          # CommandId를 만든 즉시 trap을 설치해 pointer 업로드 실패나 runner 종료 때도
          # 현재 프로세스가 살아 있는 동안 원격 명령을 중지하고 terminal 상태를 확인한다.
          deployment_terminal=false
          cancel_failed=false
          cancel_and_wait() {
            [ "$deployment_terminal" = true ] && return 0
            echo "SSM 원격 명령 중지를 요청한다: $command_id" >&2
            if ! aws ssm cancel-command --command-id "$command_id" \
              --instance-ids "$INSTANCE_ID"; then
              cancel_failed=true
              echo "::error::SSM 원격 명령 중지 요청에 실패했다: $command_id" >&2
            fi
            status=Unknown
            for _ in $(seq 1 24); do
              status=$(aws ssm get-command-invocation \
                --command-id "$command_id" --instance-id "$INSTANCE_ID" \
                --query 'Status' --output text 2>/dev/null || echo Unknown)
              case "$status" in
                Success|Failed|Cancelled|TimedOut|Undeliverable|Terminated|NoInstances|AccessDenied|InvalidPlatform|DeliveryTimedOut|ExecutionTimedOut)
                  deployment_terminal=true
                  echo "SSM 중지 후 terminal 상태: $status" >&2
                  [ "$cancel_failed" = false ]
                  return $?
                  ;;
              esac
              sleep 10
            done
            echo "::error::SSM 중지 요청 후에도 terminal 상태를 확인하지 못했다: $status" >&2
            return 1
          }
          on_exit() {
            exit_code=$?
            if [ "$deployment_terminal" != true ]; then
              if ! cancel_and_wait; then
                echo '::error::SSM 원격 명령 정리에 실패했다. 인스턴스의 명령 상태를 수동 확인해야 한다.' >&2
                [ "$exit_code" -eq 0 ] && exit_code=1
              fi
            fi
            trap - EXIT INT TERM
            exit "$exit_code"
          }
          on_signal() {
            exit 143
          }
          trap on_exit EXIT
          trap on_signal INT TERM
          command_id_file="$RUNNER_TEMP/ssm-command-id"
          printf '%s\n' "$command_id" > "$command_id_file"
          if ! aws s3api put-object \
            --bucket "$SSM_POINTER_BUCKET" \
            --key "$SSM_POINTER_KEY" \
            --body "$command_id_file" \
            --server-side-encryption AES256 >/dev/null; then
            echo "::error::SSM CommandId 보관에 실패했다: $command_id" >&2
            exit 1
          fi

          status=Pending
          terminal=false
          for _ in $(seq 1 270); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Undeliverable|Terminated|NoInstances|AccessDenied|InvalidPlatform|DeliveryTimedOut|ExecutionTimedOut)
                terminal=true
                deployment_terminal=true
                break
                ;;
            esac
            sleep 10
          done
          if [ "$terminal" != true ]; then
            status=PollingTimeout
            echo "::error::SSM 명령 상태 polling 시간이 초과됐다: $command_id" >&2
          fi

          if ! invocation_json=$(aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" --output json); then
            echo "::error::SSM 명령 결과 조회에 실패했다: $command_id" >&2
            exit 1
          fi
          invocation_status=$(printf '%s' "$invocation_json" | jq -r '.Status // "Unknown"')
          if [ "$invocation_status" != Unknown ]; then
            status="$invocation_status"
          fi
          case "$status" in
            Success|Failed|Cancelled|TimedOut|Undeliverable|Terminated|NoInstances|AccessDenied|InvalidPlatform|DeliveryTimedOut|ExecutionTimedOut)
              deployment_terminal=true
              ;;
          esac
          stdout=$(printf '%s' "$invocation_json" | jq -r '.StandardOutputContent // ""')
          stderr=$(printf '%s' "$invocation_json" | jq -r '.StandardErrorContent // ""')

          {
            echo '## 운영 배포'
            echo
            echo "대상 인스턴스: $INSTANCE_ID"
            echo "커밋: $IMAGE_TAG"
            echo "SSM CommandId: $command_id"
            echo "상태: $status"
            echo
            echo '### stdout'
            echo '~~~text'
            printf '%s\n' "$stdout"
            echo '~~~'
            echo
            echo '### stderr'
            echo '~~~text'
            printf '%s\n' "$stderr"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "===== stdout ====="
          printf '%s\n' "$stdout"
          echo "===== stderr ====="
          printf '%s\n' "$stderr"
          if [ "$status" != "Success" ]; then
            echo "배포가 실패했다 (상태 $status). 직전 이미지로 롤백하려면 Actions에서 이 워크플로를 workflow_dispatch로 실행하고 image_tag에 직전 커밋 SHA를 넣는다. 같은 production 승인 게이트를 거친다." >&2
            exit 1
          fi
          echo "배포 완료: $IMAGE_TAG"

  # SSM job이 취소되거나 polling timeout으로 실패해도 runner 종료 후 원격 명령이
  # 계속 실행되지 않도록, S3 pointer를 읽어 cancel과 terminal 확인을 수행한다.
  ssm-cancel-cleanup:
    name: 취소·시간 초과 SSM 명령 정리
    needs: [ssm-deploy]
    if: >-
      always() &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/deploy/m2') &&
      (
        (github.event_name == 'push' &&
          (needs['ssm-deploy'].result == 'failure' || needs['ssm-deploy'].result == 'cancelled')) ||
        (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.deployment_target == 'ssm' &&
          (needs['ssm-deploy'].result == 'failure' || needs['ssm-deploy'].result == 'cancelled'))
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      INSTANCE_ID: ${{ github.event.inputs.instance_id || vars.PRODUCTION_INSTANCE_ID }}
      CONFIGURED_INSTANCE_ID: ${{ vars.PRODUCTION_INSTANCE_ID }}
      SSM_POINTER_BUCKET: ${{ vars.SSM_COMMAND_POINTER_BUCKET || 'masiton-prod-codedeploy-711457211155' }}
      SSM_POINTER_KEY: masiton/ssm/${{ github.run_id }}/command-id
    steps:
      - name: AWS 자격 증명 (OIDC, 장기 키 없음)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::711457211155:role/masiton-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: SSM CommandId 조회
        id: lookup
        run: |
          set -euo pipefail
          if [ -z "$CONFIGURED_INSTANCE_ID" ] || [ "$INSTANCE_ID" != "$CONFIGURED_INSTANCE_ID" ]; then
            echo 'cleanup 대상 instance_id가 저장소 변수와 다르거나 비어 있다' >&2
            exit 1
          fi
          if [[ ! "$INSTANCE_ID" =~ ^i-[0-9a-f]{17}$ ]]; then
            echo "cleanup 대상 instance_id 형식이 올바르지 않다: '$INSTANCE_ID'" >&2
            exit 1
          fi
          command_id_file="$RUNNER_TEMP/ssm-command-id"
          if ! aws s3api get-object \
            --bucket "$SSM_POINTER_BUCKET" \
            --key "$SSM_POINTER_KEY" \
            "$command_id_file" >/dev/null; then
            echo "::error::SSM CommandId pointer를 찾지 못했다: s3://$SSM_POINTER_BUCKET/$SSM_POINTER_KEY" >&2
            exit 1
          fi
          command_id=$(tr -d '\r\n' < "$command_id_file")
          if [[ ! "$command_id" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "::error::SSM CommandId 형식이 올바르지 않다: '$command_id'" >&2
            exit 1
          fi
          printf 'resolved=%s\n' "$command_id" >> "$GITHUB_OUTPUT"

      - name: SSM 원격 명령 중지 및 terminal 확인
        env:
          RESOLVED_COMMAND_ID: ${{ steps.lookup.outputs.resolved }}
        run: |
          set -euo pipefail
          command_id="$RESOLVED_COMMAND_ID"
          status=$(aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query 'Status' --output text 2>/dev/null || echo Unknown)
          case "$status" in
            Success|Failed|Cancelled|TimedOut|Undeliverable|Terminated|NoInstances|AccessDenied|InvalidPlatform|DeliveryTimedOut|ExecutionTimedOut)
              echo "SSM cleanup 대상은 이미 terminal 상태다: $status"
              exit 0
              ;;
          esac
          cancel_failed=false
          if ! aws ssm cancel-command --command-id "$command_id" \
            --instance-ids "$INSTANCE_ID"; then
            cancel_failed=true
            echo "::error::SSM 원격 명령 중지 요청에 실패했다: $command_id" >&2
          fi
          for _ in $(seq 1 24); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo Unknown)
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Undeliverable|Terminated|NoInstances|AccessDenied|InvalidPlatform|DeliveryTimedOut|ExecutionTimedOut)
                echo "SSM cleanup terminal 상태: $status"
                [ "$cancel_failed" = false ]
                exit $?
                ;;
            esac
            sleep 10
          done
          echo "::error::SSM cleanup이 terminal 상태를 확인하지 못했다: $status" >&2
          exit 1
