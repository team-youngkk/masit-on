# ADR-CI-001 빌드·테스트 품질 게이트와 ADR-RUNTIME-001 13절 이미지 검증을 실행한다.
# 품질 게이트는 모든 변경에 적용하고, ECR push는 M2부터 배포 대상 브랜치에서만 활성화한다
# (ADR-DEPLOY-002, ADR-CI-001).
name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - 'deploy/**'

# 기본값을 읽기로 좁힌다. OIDC가 필요한 job에서만 id-token을 따로 올린다.
permissions:
  contents: read

# 같은 ref에 새 커밋이 오면 진행 중인 실행을 취소해 러너 시간을 낭비하지 않는다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 711457211155.dkr.ecr.ap-northeast-2.amazonaws.com

jobs:
  backend:
    name: 백엔드 빌드·테스트
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # 기술 정책 3절이 JDK 21을 고정한다. Gradle은 Wrapper만 사용하며
      # 시스템 Gradle로 Wrapper를 우회하지 않는다(CLAUDE.md 5절).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 통합 테스트는 Testcontainers로 PostgreSQL을 실행 시점에 띄운다.
      # ubuntu 러너에는 Docker가 이미 있다.
      - name: 빌드와 자동화 테스트
        run: ./gradlew --no-daemon clean build

      - name: 테스트 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 14

  frontend:
    name: 프론트엔드 타입 검사
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # 기술 정책 3절이 Node 24.18.0을 고정하고 frontend/.nvmrc도 같은 값이다.
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      # 이 job은 타입 검사만 한다. `next build`는 images job이 컨테이너 안에서
      # 실행하며 그쪽이 운영과 같은 Node·npm·아키텍처를 쓴다.
      #
      # 러너에서 `npm run build`(= tsc && next build)를 직접 돌렸을 때
      # `next build`가 정적 페이지 생성 단계에서 조용히 exit 1로 죽었다. npm이
      # sharp의 install 스크립트를 allow-scripts 게이트로 막아 네이티브 바이너리가
      # 준비되지 않은 것이 원인으로 보인다. 같은 명령이 컨테이너 안에서는 통과한다.
      #
      # 러너 환경을 우회로 맞추는 대신 빌드 검증 지점을 컨테이너 하나로 모았다.
      # `next build` 실패는 images job에서 그대로 차단된다.
      - name: 타입 검사
        working-directory: frontend
        run: npm run typecheck

  images:
    name: 이미지 빌드·검증·push
    needs: [backend, frontend]
    # 운영 EC2가 arm64(t4g.medium)이므로 같은 아키텍처에서 빌드한다.
    # 공개 저장소는 arm64 러너를 무료로 쓸 수 있어 QEMU 에뮬레이션이 필요 없다.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # ADR-RUNTIME-001 13절: 베이스 이미지가 명시 태그(운영은 digest)를 쓰는지 대조한다.
      # digest 없이 태그만 쓴 FROM이 하나라도 있으면 실패시킨다.
      - name: 베이스 이미지 digest 고정 검사
        run: |
          set -euo pipefail
          status=0
          for dockerfile in Dockerfile frontend/Dockerfile; do
            while read -r line; do
              case "$line" in
                *@sha256:*) ;;
                *) echo "digest 미고정: $dockerfile -> $line"; status=1 ;;
              esac
            done < <(grep -E '^FROM ' "$dockerfile")
          done
          if [ "$status" -ne 0 ]; then
            echo '베이스 이미지는 태그와 digest를 함께 고정해야 한다.'
            exit 1
          fi
          echo 'FROM 전부 digest 고정 확인'

      - name: 백엔드 이미지 빌드
        run: docker build -t masiton-backend:${{ github.sha }} -f Dockerfile .

      - name: 프론트엔드 이미지 빌드
        run: docker build -t masiton-frontend:${{ github.sha }} -f frontend/Dockerfile frontend

      # ADR-RUNTIME-001 13절: 이미지에 평문 비밀값이나 .env가 포함되지 않았는지 검사한다.
      # 하나라도 걸리면 push와 배포를 차단한다.
      - name: 이미지 비밀값·실행 사용자 검증
        run: |
          set -euo pipefail
          for image in masiton-backend:${{ github.sha }} masiton-frontend:${{ github.sha }}; do
            echo "=== $image ==="

            if docker run --rm --entrypoint sh "$image" -c \
              "find / -xdev -name '.env' -o -xdev -name '.env.*' 2>/dev/null | head -1" | grep -q .; then
              echo '.env 파일이 이미지에 포함됐다'
              exit 1
            fi
            echo '.env 미포함 확인'

            if docker run --rm --entrypoint sh "$image" -c \
              "grep -rIl -e 'BEGIN PRIVATE KEY' -e 'BEGIN RSA PRIVATE KEY' -e 'JWT_PRIVATE_KEY_PEM' -e 'POSTGRES_PASSWORD' /app 2>/dev/null | head -1" | grep -q .; then
              echo '평문 비밀값 패턴이 이미지에 포함됐다'
              exit 1
            fi
            echo '평문 비밀값 패턴 미포함 확인'

            uid=$(docker run --rm --entrypoint id "$image" -u)
            if [ "$uid" = "0" ]; then
              echo "root로 실행된다 (uid=$uid)"
              exit 1
            fi
            echo "비루트 실행 확인 (uid=$uid)"
          done

      # 여기까지가 자격 증명 없이 수행하는 검증이다.
      # PR은 AWS 권한을 받지 못하므로 아래 push 단계는 배포 대상 브랜치에서만 실행된다.
      # OIDC 신뢰 정책도 refs/heads/deploy/m2와 refs/heads/main만 허용한다.
      - name: AWS 자격 증명 (OIDC, 장기 키 없음)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/deploy/m2'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::711457211155:role/masiton-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/deploy/m2'
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      # 태그는 커밋 SHA를 쓴다. `latest`는 기술 정책 3절이 금지한다.
      # 리포지토리가 IMMUTABLE이라 같은 SHA를 다시 push할 수 없다.
      - name: 이미지 push와 digest 기록
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/deploy/m2'
        run: |
          set -euo pipefail
          {
            echo '## 게시된 이미지'
            echo
            echo '| 리포지토리 | 태그 | digest |'
            echo '|---|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"

          for name in backend frontend; do
            local_tag="masiton-${name}:${{ github.sha }}"
            remote_tag="${ECR_REGISTRY}/masiton-${name}:${{ github.sha }}"
            docker tag "$local_tag" "$remote_tag"
            docker push "$remote_tag"

            digest=$(aws ecr describe-images \
              --repository-name "masiton-${name}" \
              --image-ids imageTag=${{ github.sha }} \
              --query 'imageDetails[0].imageDigest' --output text)
            echo "masiton-${name} digest: ${digest}"
            echo "| masiton-${name} | ${{ github.sha }} | \`${digest}\` |" >> "$GITHUB_STEP_SUMMARY"
          done
