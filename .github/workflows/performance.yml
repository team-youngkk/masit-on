# NFR-PERFORMANCE-006 공개 조회 및 NFR-PERFORMANCE-007 3차 확장 성능 검증.
#
# 수동 트리거 전용이다. pull_request·push·schedule 트리거를 붙이지 않는다.
# 저장소 ruleset이 필수 상태 검사로 요구하는 이름은 `백엔드 빌드·테스트`와
# `프론트엔드 빌드·타입 검사` 둘뿐이다. 이 워크플로가 PR에 붙으면 새 검사 이름이
# PR 체크 목록에 나타나 병합 게이트의 판단 기준이 흐트러진다. 또 부하 테스트는
# 운영 동급 임시 환경(EC2 t2.micro, RDS db.t4g.micro)을 대상으로 하므로 PR마다
# 돌릴 수 있는 성격이 아니다. 측정할 준비가 된 시점에 사람이 직접 실행한다.
#
# 측정 대상 환경은 Kakao·YouTube 외부 연동을 WireMock Stub으로 대체한 상태여야 한다.
# 실제 외부 API를 호출하는 환경을 base_url로 넣지 않는다.
#
# 주의: 이 저장소는 공개 저장소다. workflow_dispatch 입력값은 실행 페이지에 그대로
# 표시되고 Secret처럼 마스킹되지 않는다. 즉 여기에 넣은 base_url은 누구나 볼 수 있다.
# 게다가 GitHub 호스티드 러너에는 고정 egress IP가 없어, 러너가 대상에 도달하려면
# 보안 그룹을 넓게 열어야 한다. 측정 인스턴스는 운영과 달리 Nginx 검증 게이트 없이
# 애플리케이션 8080이 그대로 노출된 상태다.
#
# 따라서 RV-NFR-011이 요구하는 운영 동급 측정은 이 워크플로가 아니라 대상과 같은 VPC
# 안에서 k6를 직접 실행하는 방식을 쓴다. 절차는 ADR-PERF-001 6.3절과
# docs/08-planning/second-expansion-performance-verification.md 5절에 있다.
# 이 워크플로는 인터넷에 노출해도 되는 임시 환경을 상대로 시나리오가 도는지 확인하는
# 보조 수단이다.
name: 성능

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: '측정 대상 애플리케이션 URL (예: http://10.0.1.10:8080)'
        required: true
        type: string
      scenario:
        description: '실행할 성능 시나리오'
        required: true
        default: all
        type: choice
        options:
          - public-read
          - third-expansion
          - all
      load_profile:
        description: '부하 프로필'
        required: true
        default: normal
        type: choice
        options:
          - normal
          - max
      public_read_mode:
        description: '자연어 검색 검증 모드. contract(요청 제한 아래 저속 계약 검증)와 throughput(제한 초과 포화 관찰)을 별도 실행한다. 둘 다 NFR-PERFORMANCE-007 성능 인증이 아니다'
        required: true
        default: contract
        type: choice
        options:
          - contract
          - throughput
      course_metric_mode:
        description: '코스 측정 프로필. internal(무지연 Stub)과 external(외부 지연 포함 Stub)을 별도 실행한다'
        required: true
        default: internal
        type: choice
        options:
          - internal
          - external
      course_restaurant_ids:
        description: '좌표가 준비된 공개 맛집 ID 2~5개(쉼표 구분, 코스 경로 측정용)'
        required: false
        type: string
      notes:
        description: '실행 메모 (측정 환경·데이터 상태 등). 결과 요약에 남는다'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  load-test:
    name: 성능 부하 테스트
    runs-on: ubuntu-24.04
    env:
      # 팀이 확정한 부하 도구 버전이다. 기술 정책 3절에 따라 `latest`를 쓰지 않는다.
      K6_VERSION: '2.1.0'
      BASE_URL: ${{ inputs.base_url }}
      LOAD_PROFILE: ${{ inputs.load_profile }}
      RUN_SCENARIO: ${{ inputs.scenario }}
    steps:
      - uses: actions/checkout@v4

      - name: 3차 확장 증적 manifest 정적 검증
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File ./scripts/verify-third-expansion-evidence.ps1 -RepositoryRoot "$env:GITHUB_WORKSPACE"

      # 대상 URL은 자유 문자열 입력이라 쉘 명령으로 흘러 들어가기 전에 형식을 검사한다.
      # `checkout` 직후에 검증하여 잘못된 입력이나 제한 공개 운영 환경 대상 실행을
      # 설치 과정 전에 빠르게 거부한다.
      #
      # 운영 대상 차단은 오타·착각으로 제한 공개 인스턴스에 7,000건 넘는 요청이 들어가는
      # 것을 막는다. 운영 도메인은 Nginx 검증 게이트가 앞에 있어 시나리오가 setup에서
      # 중단되지만, 오리진(EC2 주소:8080)을 직접 넣으면 게이트를 건너뛴다. 도메인만으로는
      # 그 경로를 막을 수 없으므로 배포 고도화 이후 운영 오리진 IP/도메인이 확정되면
      # 이 검증 목록에 함께 추가하도록 조치한다.
      - name: 측정 대상 URL 검증
        run: |
          set -euo pipefail
          case "$BASE_URL" in
            http://*|https://*) ;;
            *) echo "base_url은 http:// 또는 https://로 시작해야 한다" >&2; exit 1 ;;
          esac
          case "$BASE_URL" in
            *[[:space:]]*|*'`'*|*'$'*|*';'*|*'&'*|*'|'*)
              echo "base_url에 허용되지 않는 문자가 있다" >&2; exit 1 ;;
          esac
          case "$BASE_URL" in
            *'@'*|*'?'*|*'#'*)
              echo "base_url에는 user-info, query, fragment를 넣을 수 없다" >&2; exit 1 ;;
          esac
          case "$BASE_URL" in
            *masiton.click*)
              echo "제한 공개 운영 환경은 부하 대상이 아니다(ADR-PERF-001 6.4절)" >&2; exit 1 ;;
          esac
          echo "형식 검증 통과"

      - name: 코스 측정 입력 검증
        if: ${{ inputs.scenario == 'third-expansion' || inputs.scenario == 'all' }}
        env:
          COURSE_RESTAURANT_IDS: ${{ inputs.course_restaurant_ids }}
        run: |
          set -euo pipefail
          if [ -z "${COURSE_RESTAURANT_IDS//[[:space:]]/}" ]; then
            echo "course_restaurant_ids가 비어 있어 k6 setup의 auto-discovery를 사용한다"
            exit 0
          fi
          if [[ "$COURSE_RESTAURANT_IDS" == ,* || "$COURSE_RESTAURANT_IDS" == *, || "$COURSE_RESTAURANT_IDS" == *,,* ]]; then
            echo "course_restaurant_ids에 빈 ID가 있다" >&2
            exit 1
          fi
          IFS=',' read -r -a course_ids <<< "$COURSE_RESTAURANT_IDS"
          if [ "${#course_ids[@]}" -lt 2 ] || [ "${#course_ids[@]}" -gt 5 ]; then
            echo "course_restaurant_ids는 2~5개의 공개 맛집 ID를 쉼표로 구분해 입력해야 한다" >&2
            exit 1
          fi
          for raw_id in "${course_ids[@]}"; do
            trimmed_id="$(printf '%s' "$raw_id" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [ -z "$trimmed_id" ]; then
              echo "course_restaurant_ids에 빈 ID가 있다" >&2
              exit 1
            fi
          done
          echo "코스 측정 입력 검증 통과 (${#course_ids[@]}개)"

      # 서드파티 setup 액션을 쓰지 않는다. 공식 릴리즈 tarball을 버전 고정해 받는 쪽이
      # 의존성이 적고 무엇이 설치되는지 워크플로 안에서 그대로 읽힌다.
      #
      # 체크섬은 같은 릴리즈의 checksums 파일이 아니라 워크플로에 박은 리터럴로 대조한다.
      # 릴리즈 자산이 바뀌면 checksums 파일도 같이 바뀌므로 그 파일과의 대조는 전송 중
      # 손상만 잡고 자산 교체는 잡지 못한다. 값이 저장소에 있으면 변경이 diff로 드러난다.
      # K6_VERSION을 올릴 때 이 값도 같이 바꾼다.
      - name: k6 설치 (버전 고정)
        env:
          K6_SHA256: '295d961ebfca306f295f1133068dcd403a8171c87f387928f5f30b0fbcff858a'
        run: |
          set -euo pipefail
          asset="k6-v${K6_VERSION}-linux-amd64"
          curl -fsSL -o k6.tar.gz \
            "https://github.com/grafana/k6/releases/download/v${K6_VERSION}/${asset}.tar.gz"
          echo "${K6_SHA256}  k6.tar.gz" | sha256sum -c -
          tar -xzf k6.tar.gz
          sudo install -m 0755 "${asset}/k6" /usr/local/bin/k6
          rm -rf k6.tar.gz "${asset}"
          installed=$(k6 version)
          echo "설치된 k6: ${installed}"
          case "$installed" in
            *"v${K6_VERSION}"*) ;;
            *) echo "요구 버전 v${K6_VERSION}이 아니다"; exit 1 ;;
          esac

      # threshold를 위반하면 k6가 종료 코드 99로 끝나고 이 step이 실패하므로 job도
      # 실패한다. 사람 판단 없이 통과·실패가 갈리는 것이 이 워크플로의 목적이다.
      # LOAD_PROFILE은 workflow_dispatch의 choice 입력으로만 정한다.
      - name: 공개 조회 시나리오 실행 (${{ inputs.load_profile }})
        if: ${{ inputs.scenario == 'public-read' || inputs.scenario == 'all' }}
        run: |
          mkdir -p "$RESULT_DIR"
          k6 run --env BASE_URL="$BASE_URL" --env LOAD_PROFILE="$LOAD_PROFILE" --env RESULT_DIR="$RESULT_DIR" perf/k6/normal-load-public-read.js
        env:
          BASE_URL: ${{ inputs.base_url }}
          LOAD_PROFILE: ${{ inputs.load_profile }}
          RESULT_DIR: perf/k6/results/${{ inputs.load_profile }}/public-read

      # 자연어 검색은 client address별 요청 제한을 받는다. 러너 한 곳에서 보내는
      # 요청은 같은 주소로 집계되므로 load_profile만으로 실행 조건이 결정되지 않는다.
      # PUBLIC_READ_MODE를 명시 전달하고 결과 경로에도 넣어, contract 실행 결과가
      # load_profile 이름만 보고 최대 부하 측정으로 인용되지 않게 한다.
      - name: 3차 확장 자연어 시나리오 실행 (${{ inputs.load_profile }} / ${{ inputs.public_read_mode }})
        if: ${{ inputs.scenario == 'third-expansion' || inputs.scenario == 'all' }}
        run: |
          mkdir -p "$RESULT_DIR"
          k6 run --env BASE_URL="$BASE_URL" --env LOAD_PROFILE="$LOAD_PROFILE" --env SCENARIO=public-read --env PUBLIC_READ_MODE="$PUBLIC_READ_MODE" --env RESULT_DIR="$RESULT_DIR" perf/k6/third-expansion-load.js
        env:
          BASE_URL: ${{ inputs.base_url }}
          LOAD_PROFILE: ${{ inputs.load_profile }}
          SCENARIO: public-read
          PUBLIC_READ_MODE: ${{ inputs.public_read_mode }}
          RESULT_DIR: perf/k6/results/${{ inputs.load_profile }}/third-expansion/natural-language/${{ inputs.public_read_mode }}

      - name: 3차 확장 코스 시나리오 실행 (${{ inputs.load_profile }} / ${{ inputs.course_metric_mode }})
        if: ${{ inputs.scenario == 'third-expansion' || inputs.scenario == 'all' }}
        run: |
          mkdir -p "$RESULT_DIR"
          k6 run --env BASE_URL="$BASE_URL" --env LOAD_PROFILE="$LOAD_PROFILE" --env SCENARIO=course --env COURSE_METRIC_MODE="$COURSE_METRIC_MODE" --env COURSE_RESTAURANT_IDS="$COURSE_RESTAURANT_IDS" --env RESULT_DIR="$RESULT_DIR" perf/k6/third-expansion-load.js
        env:
          BASE_URL: ${{ inputs.base_url }}
          LOAD_PROFILE: ${{ inputs.load_profile }}
          SCENARIO: course
          COURSE_METRIC_MODE: ${{ inputs.course_metric_mode }}
          COURSE_RESTAURANT_IDS: ${{ inputs.course_restaurant_ids }}
          RESULT_DIR: perf/k6/results/${{ inputs.load_profile }}/third-expansion/course/${{ inputs.course_metric_mode }}

      - name: 결과 요약 기록
        if: always()
        run: |
          set -euo pipefail
          # 대상 주소를 여기에 적지 않는다. 공개 저장소의 실행 요약과 아티팩트는 누구나
          # 읽으므로, 게이트 없이 8080을 노출한 측정 인스턴스의 주소를 남기지 않는다.
          # 어느 환경을 쟀는지는 검증 결과 문서에 기록한다.
          {
            echo "## 성능 결과 (${LOAD_PROFILE}; ${RUN_SCENARIO})"
            echo
            echo "- k6: v${K6_VERSION}"
            echo "- 메모: ${NOTES:-(없음)}"
            echo
            case "$RUN_SCENARIO" in
              public-read)
                summaries=("perf/k6/results/${LOAD_PROFILE}/public-read/summary.txt")
                ;;
              third-expansion)
                summaries=(
                  "perf/k6/results/${LOAD_PROFILE}/third-expansion/natural-language/${PUBLIC_READ_MODE}/summary.txt"
                  "perf/k6/results/${LOAD_PROFILE}/third-expansion/course/${COURSE_METRIC_MODE}/summary.txt"
                )
                ;;
              all)
                summaries=(
                  "perf/k6/results/${LOAD_PROFILE}/public-read/summary.txt"
                  "perf/k6/results/${LOAD_PROFILE}/third-expansion/natural-language/${PUBLIC_READ_MODE}/summary.txt"
                  "perf/k6/results/${LOAD_PROFILE}/third-expansion/course/${COURSE_METRIC_MODE}/summary.txt"
                )
                ;;
              *)
                echo "지원하지 않는 실행 시나리오: $RUN_SCENARIO" >&2
                exit 1
                ;;
            esac
            for summary in "${summaries[@]}"; do
              if [ -f "$summary" ]; then
                echo '```text'
                cat "$summary"
                echo '```'
              else
                echo "요약 파일이 생성되지 않았다: $summary"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          NOTES: ${{ inputs.notes }}
          PUBLIC_READ_MODE: ${{ inputs.public_read_mode }}
          COURSE_METRIC_MODE: ${{ inputs.course_metric_mode }}

      # 선택한 실행의 결과만 보관한다. 선택하지 않은 실행의 파일이 없는 것은
      # 정상적인 workflow_dispatch 경로이므로 해당 upload step 자체를 건너뛴다.
      # 보관 기간은 ci.yml의 테스트 리포트와 같은 14일로 맞춘다.
      - name: 공개 조회 결과 보관
        if: ${{ always() && (inputs.scenario == 'public-read' || inputs.scenario == 'all') }}
        uses: actions/upload-artifact@v4
        with:
          name: k6-${{ inputs.load_profile }}-public-read-results
          path: |
            perf/k6/results/${{ inputs.load_profile }}/public-read/summary.json
            perf/k6/results/${{ inputs.load_profile }}/public-read/summary.txt
          retention-days: 14
          if-no-files-found: error

      - name: 3차 확장 자연어 결과 보관
        if: ${{ always() && (inputs.scenario == 'third-expansion' || inputs.scenario == 'all') }}
        uses: actions/upload-artifact@v4
        with:
          name: k6-${{ inputs.load_profile }}-third-expansion-natural-language-${{ inputs.public_read_mode }}-results
          path: |
            perf/k6/results/${{ inputs.load_profile }}/third-expansion/natural-language/${{ inputs.public_read_mode }}/summary.json
            perf/k6/results/${{ inputs.load_profile }}/third-expansion/natural-language/${{ inputs.public_read_mode }}/summary.txt
          retention-days: 14
          if-no-files-found: error

      - name: 3차 확장 코스 결과 보관
        if: ${{ always() && (inputs.scenario == 'third-expansion' || inputs.scenario == 'all') }}
        uses: actions/upload-artifact@v4
        with:
          name: k6-${{ inputs.load_profile }}-third-expansion-course-${{ inputs.course_metric_mode }}-results
          path: |
            perf/k6/results/${{ inputs.load_profile }}/third-expansion/course/${{ inputs.course_metric_mode }}/summary.json
            perf/k6/results/${{ inputs.load_profile }}/third-expansion/course/${{ inputs.course_metric_mode }}/summary.txt
          retention-days: 14
          if-no-files-found: error
